        - coffee
        - dinner
      description: Something to do together after the event
    GenderPreference:
      type: string
      enum:
        - any
        - female
        - male
      description: >-
        Whom the user wants to go with: `any` accepts every gender, including
        `other`; `female` and `male` only that gender
    ApplicationStatus:
      type: string
      enum:
        - in_pool
        - paired
        - paused
        - removed
        - withdrawn
        - no_match
        - cancelled
      description: >-
        `in_pool`: waiting for a match. `paired`: a match is proposed. `paused`:
        a proposal went unanswered, waiting for the user to continue. `removed`:
        a second proposal went unanswered. `withdrawn`: the user left the pool.
        `no_match`: no match was found by the cutoff. `cancelled`: the event was
        cancelled or the user banned
    CreateApplicationBody:
      type: object
      properties:
