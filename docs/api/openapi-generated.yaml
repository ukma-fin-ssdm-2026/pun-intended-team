              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/matches/{id}/contacts:
    get:
      operationId: getMatchContacts
      summary: Get the contacts of a mutual match
      description: >-
        How to reach the other user, once both accepted. Before that, and for a
        match that did not go ahead, the answer is `404`, as for a match that
        does not exist (SEC-001). A mutual match answers `422` until the caller
        has acknowledged the safety notice with `acknowledgeSafetyNotice`
        (SAFE-002). Needs a signed-in account; a guest token gets 401.
      tags:
        - Matching
      security:
        - bearerAuth: []
      parameters:
        - schema:
