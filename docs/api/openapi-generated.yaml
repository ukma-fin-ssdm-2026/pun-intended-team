openapi: 3.0.3
info:
  title: Nearby API
  version: 0.1.0
  description: >-
    REST API of Nearby, an app for going to events and meeting people along the
    way.
servers:
  - url: http://localhost:4100
    description: Local development
tags:
  - name: Events
    description: Events users can go to together
  - name: System
    description: Service endpoints
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: >-
        An access token, or a guest token for catalog reads. Until sign-in is
        implemented, use a stub token: `stub-guest`, `stub-user`, `stub-user-2`,
        `stub-org` (verified organization), `stub-org-pending` or `stub-admin`.
  schemas:
    EventsPage:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Event'
        page:
          $ref: '#/components/schemas/PageInfo'
      required:
        - items
        - page
    Event:
      type: object
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        description:
          type: string
        category:
          $ref: '#/components/schemas/Category'
        venue:
          $ref: '#/components/schemas/Venue'
        startsAt:
          type: string
          format: date-time
        endsAt:
          type: string
          format: date-time
        source:
          $ref: '#/components/schemas/EventSource'
        status:
          $ref: '#/components/schemas/EventStatus'
      required:
        - id
        - title
        - description
        - category
        - venue
        - startsAt
        - endsAt
        - source
        - status
      description: An event users can go to together
      example:
        id: 3f1c2a9e-8b4d-4e2a-9c71-5d0e6b7a8f10
        title: 'Open-air film night: Shadows of Forgotten Ancestors'
        description: Screening in the park, bring a blanket.
        category:
          id: 0b6f2d4a-8c1e-4a3b-9d5f-7e2a4c6b8d01
          name: Cinema
        venue:
          id: 5a1c3e5f-7b9d-4f1a-8c3e-5f7a9b1d3e05
          name: Natalka Park lawn
          address: Naberezhno-Luhova St, Kyiv
          location:
            lat: 50.4825
            lng: 30.5181
        startsAt: '2026-10-17T19:00:00+03:00'
        endsAt: '2026-10-17T21:30:00+03:00'
        source: organization
        status: published
    Category:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
      required:
        - id
        - name
      description: An event category from the directory administrators manage
      example:
        id: 0b6f2d4a-8c1e-4a3b-9d5f-7e2a4c6b8d01
        name: Cinema
    Venue:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        address:
          type: string
        location:
          type: object
          properties:
            lat:
              type: number
            lng:
              type: number
          required:
            - lat
            - lng
      required:
        - id
        - name
        - address
        - location
      description: Where an event takes place
    EventSource:
      type: string
      enum:
        - organization
        - import
      description: 'Who added the event: a verified organization or the importer'
    EventStatus:
      type: string
      enum:
        - published
        - cancelled
    PageInfo:
      type: object
      properties:
        limit:
          type: integer
        offset:
          type: integer
        hasMore:
          type: boolean
          description: Whether another page follows
      required:
        - limit
        - offset
        - hasMore
    ErrorResponse:
      type: object
      properties:
        error:
          type: object
          properties:
            code:
              $ref: '#/components/schemas/ErrorCode'
            message:
              type: string
            details:
              type: array
              items:
                $ref: '#/components/schemas/ValidationIssue'
              description: Every invalid field, for validation errors that can name them
          required:
            - code
            - message
      required:
        - error
      description: The body of every error response
      example:
        error:
          code: VALIDATION_ERROR
          message: The request is invalid
          details:
            - location: params
              field: id
              message: Invalid UUID
    ErrorCode:
      type: string
      enum:
        - VALIDATION_ERROR
        - UNAUTHENTICATED
        - PAYLOAD_TOO_LARGE
        - RATE_LIMITED
        - INTERNAL_ERROR
        - NOT_FOUND
        - CONFLICT
        - REFERENCE_NOT_FOUND
        - ORGANIZATION_NOT_VERIFIED
        - EVENT_CANCELLED
        - EVENT_ENDS_BEFORE_START
      description: Machine-readable code; clients branch on it, not on the message
    ValidationIssue:
      type: object
      properties:
        location:
          $ref: '#/components/schemas/ValidationLocation'
        field:
          type: string
        message:
          type: string
      required:
        - location
        - field
        - message
      description: One invalid field of the request
    ValidationLocation:
      type: string
      enum:
        - params
        - query
        - body
      description: Part of the request the invalid field is in
    CreateEventBody:
      type: object
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 120
        description:
          type: string
          maxLength: 5000
        categoryId:
          type: string
          format: uuid
        venueId:
          type: string
          format: uuid
          description: One of the organization's own venues
        startsAt:
          type: string
          format: date-time
        endsAt:
          type: string
          format: date-time
      required:
        - title
        - description
        - categoryId
        - venueId
        - startsAt
        - endsAt
    UpdateEventBody:
      type: object
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 120
        description:
          type: string
          maxLength: 5000
        categoryId:
          type: string
          format: uuid
        venueId:
          type: string
          format: uuid
          description: One of the organization's own venues
        startsAt:
          type: string
          format: date-time
        endsAt:
          type: string
          format: date-time
      description: Only the fields to change
    HealthResponse:
      type: object
      properties:
        status:
          type: string
          enum:
            - ok
      required:
        - status
      description: Returned while the API is up
      example:
        status: ok
  parameters: {}
paths:
  /api/v1/events:
    get:
      operationId: listEvents
      summary: Browse the event catalog
      description: Published events in the catalog window, soonest first.
      tags:
        - Events
      security:
        - bearerAuth: []
      parameters:
        - schema:
            type: integer
            minimum: 1
            maximum: 20
            default: 20
            description: Items per page, at most 20
          required: false
          description: Items per page, at most 20
          name: limit
          in: query
        - schema:
            type: integer
            nullable: true
            minimum: 0
            default: 0
            description: Items to skip
          required: false
          description: Items to skip
          name: offset
          in: query
        - schema:
            type: string
            format: uuid
            description: Only events of this category
          required: false
          description: Only events of this category
          name: categoryId
          in: query
        - schema:
            type: string
            format: uuid
            description: Only events at this venue, e.g. after tapping its map pin
          required: false
          description: Only events at this venue, e.g. after tapping its map pin
          name: venueId
          in: query
        - schema:
            type: string
            format: date
            description: First day, Kyiv time; earlier dates count as today
          required: false
          description: First day, Kyiv time; earlier dates count as today
          name: from
          in: query
        - schema:
            type: string
            format: date
            description: >-
              Last day, Kyiv time; later dates count as the end of the catalog
              window
          required: false
          description: >-
            Last day, Kyiv time; later dates count as the end of the catalog
            window
          name: to
          in: query
      responses:
        '200':
          description: A page of events
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventsPage'
        '400':
          description: The request is invalid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: No access token, or an invalid or expired one
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    post:
      operationId: createEvent
      summary: Publish an event
      tags:
        - Events
      security:
        - bearerAuth: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateEventBody'
      responses:
        '201':
          description: The published event
          headers:
            Location:
              description: URL of the created object
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Event'
        '400':
          description: The request is invalid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: No access token, or an invalid or expired one
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: >-
            `ORGANIZATION_NOT_VERIFIED`: the caller is not a verified
            organization. `REFERENCE_NOT_FOUND`: no such active category, or the
            venue is not one of the organization’s own.
            `EVENT_ENDS_BEFORE_START`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/events/{id}:
    get:
      operationId: getEvent
      summary: Get an event
      tags:
        - Events
      security:
        - bearerAuth: []
      parameters:
        - schema:
            type: string
            format: uuid
            description: Event id
          required: true
          description: Event id
          name: id
          in: path
      responses:
        '200':
          description: The event
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Event'
        '400':
          description: The request is invalid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: No access token, or an invalid or expired one
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: No event with this id, or the caller may not access it
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    patch:
      operationId: updateEvent
      summary: Edit an event
      tags:
        - Events
      security:
        - bearerAuth: []
      parameters:
        - schema:
            type: string
            format: uuid
            description: Event id
          required: true
          description: Event id
          name: id
          in: path
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateEventBody'
      responses:
        '200':
          description: The updated event
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Event'
        '400':
          description: The request is invalid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: No access token, or an invalid or expired one
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: No event with this id, or it is not one of the organization’s own
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: >-
            `EVENT_CANCELLED`: a cancelled event cannot be edited.
            `ORGANIZATION_NOT_VERIFIED`, `REFERENCE_NOT_FOUND`,
            `EVENT_ENDS_BEFORE_START`: as when publishing.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/events/{id}/cancel:
    post:
      operationId: cancelEvent
      summary: Cancel an event
      description: >-
        The event stays readable with status `cancelled`. Cancelling it again
        changes nothing.
      tags:
        - Events
      security:
        - bearerAuth: []
      parameters:
        - schema:
            type: string
            format: uuid
            description: Event id
          required: true
          description: Event id
          name: id
          in: path
      responses:
        '200':
          description: The cancelled event
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Event'
        '400':
          description: The request is invalid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: No access token, or an invalid or expired one
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: No event with this id, or it is not one of the organization’s own
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /health:
    get:
      operationId: getHealth
      summary: Check that the API is running
      tags:
        - System
      responses:
        '200':
          description: The API is up
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
