    ApplicationSession:
      type: object
      properties:
        startsAt:
          type: string
          format: date-time
          description: >-
            The event start, or a picked day of a multi-day event at its time of
            day
        cutoffAt:
          type: string
          format: date-time
          description: >-
            When matching for this day stops: an hour before it starts, or for a
            session of 3 hours or more 2 hours before it ends. After the last
            round and before this, the pool is in open mode
      required:
