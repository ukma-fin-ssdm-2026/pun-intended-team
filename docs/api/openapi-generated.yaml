openapi: 3.0.3
info:
  title: Nearby API
  version: 0.1.1
  description: >-
    REST API of Nearby, an app for going to events and meeting people along the
    way.
servers:
  - url: http://localhost:4100
    description: Local development
tags:
  - name: Auth
    description: Registration, sign-in methods and guest tokens
  - name: Events
    description: Events users can go to together
  - name: Listings
    description: '"Looking for company" posts'
  - name: Profiles
    description: The signed-in user’s profile, filled in step by step during onboarding
  - name: Interests
    description: The fixed list of interests users pick from
  - name: Categories
    description: The event category directory
  - name: System
    description: Service endpoints
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: >-
        An access token from `/api/v1/auth/sign-in` or `/api/v1/auth/verify`, or
        a guest token from `/api/v1/auth/guest` for catalog reads.
  schemas:
    AdminCategoryList:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/AdminCategory'
      required:
        - items
      example:
        items:
          - id: 2d8b4f6c-0e3a-4c5d-9f7b-9a4c6e8d0f03
            name: Concerts
            isActive: true
    AdminCategory:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        isActive:
          type: boolean
          description: Inactive categories are hidden from filters and cannot be picked
      required:
        - id
        - name
        - isActive
      description: A category as administrators see it
      example:
        id: 2d8b4f6c-0e3a-4c5d-9f7b-9a4c6e8d0f03
        name: Concerts
        isActive: true
    ErrorResponse:
      type: object
      properties:
        error:
          type: object
          properties:
            code:
              $ref: '#/components/schemas/ErrorCode'
            message:
              type: string
            details:
              type: array
              items:
                $ref: '#/components/schemas/ValidationIssue'
              description: >-
                Every invalid field, for validation errors and business rules
                that can name them
          required:
            - code
            - message
      required:
        - error
      description: The body of every error response
      example:
        error:
          code: VALIDATION_ERROR
          message: The request is invalid
          details:
            - location: params
              field: id
              message: Invalid UUID
    ErrorCode:
      type: string
      enum:
        - VALIDATION_ERROR
        - UNAUTHENTICATED
        - PAYLOAD_TOO_LARGE
        - RATE_LIMITED
        - INTERNAL_ERROR
        - NOT_FOUND
        - CONFLICT
        - REFERENCE_NOT_FOUND
        - ORGANIZATION_NOT_VERIFIED
        - EVENT_CANCELLED
        - EVENT_ENDS_BEFORE_START
        - LISTING_DATE_IN_PAST
        - USERNAME_TAKEN
        - PROFILE_EXISTS
        - CONTACT_REQUIRED
        - INVALID_SOCIAL_HANDLE
        - INVALID_CREDENTIALS
        - WRONG_PASSWORD
        - INVALID_GOOGLE_TOKEN
        - GOOGLE_ACCOUNT_TAKEN
        - GOOGLE_ALREADY_LINKED
        - INVALID_CODE
        - PHONE_CODES_UNAVAILABLE
        - INVALID_REFRESH_TOKEN
        - UNDERAGE
      description: Machine-readable code; clients branch on it, not on the message
    ValidationIssue:
      type: object
      properties:
        location:
          $ref: '#/components/schemas/ValidationLocation'
        field:
          type: string
        message:
          type: string
      required:
        - location
        - field
        - message
      description: One invalid field of the request
    ValidationLocation:
      type: string
      enum:
        - params
        - query
        - body
      description: Part of the request the invalid field is in
    CreateCategoryBody:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 60
          description: Unique, case-insensitive
        isActive:
          type: boolean
          default: true
          description: Whether users can pick the category
      required:
        - name
      additionalProperties: false
      example:
        name: Workshops
    UpdateCategoryBody:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 60
          description: Unique, case-insensitive
        isActive:
          type: boolean
          description: Whether users can pick the category
      additionalProperties: false
      description: Only the fields to change
      example:
        isActive: false
    CategoryList:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Category'
      required:
        - items
      example:
        items:
          - id: 2d8b4f6c-0e3a-4c5d-9f7b-9a4c6e8d0f03
            name: Concerts
    Category:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
      required:
        - id
        - name
      description: An event category from the directory administrators manage
      example:
        id: 2d8b4f6c-0e3a-4c5d-9f7b-9a4c6e8d0f03
        name: Concerts
    EventsPage:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Event'
        page:
          $ref: '#/components/schemas/PageInfo'
      required:
        - items
        - page
      example:
        items:
          - id: 3f1c2a9e-8b4d-4e2a-9c71-5d0e6b7a8f10
            title: 'Open-air film night: Shadows of Forgotten Ancestors'
            description: Screening in the park, bring a blanket.
            category:
              id: 2d8b4f6c-0e3a-4c5d-9f7b-9a4c6e8d0f03
              name: Concerts
            venue:
              id: 5a1c3e5f-7b9d-4f1a-8c3e-5f7a9b1d3e05
              name: Natalka Park lawn
              address: Naberezhno-Luhova St, Kyiv
              location:
                lat: 50.4825
                lng: 30.5181
            startsAt: '2026-10-17T19:00:00+03:00'
            endsAt: '2026-10-17T21:30:00+03:00'
            source: organization
            status: published
        page:
          limit: 20
          offset: 0
          hasMore: false
    Event:
      type: object
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        description:
          type: string
        category:
          $ref: '#/components/schemas/Category'
        venue:
          $ref: '#/components/schemas/Venue'
        startsAt:
          type: string
          format: date-time
        endsAt:
          type: string
          format: date-time
        source:
          $ref: '#/components/schemas/EventSource'
        status:
          $ref: '#/components/schemas/EventStatus'
      required:
        - id
        - title
        - description
        - category
        - venue
        - startsAt
        - endsAt
        - source
        - status
      description: An event users can go to together
      example:
        id: 3f1c2a9e-8b4d-4e2a-9c71-5d0e6b7a8f10
        title: 'Open-air film night: Shadows of Forgotten Ancestors'
        description: Screening in the park, bring a blanket.
        category:
          id: 2d8b4f6c-0e3a-4c5d-9f7b-9a4c6e8d0f03
          name: Concerts
        venue:
          id: 5a1c3e5f-7b9d-4f1a-8c3e-5f7a9b1d3e05
          name: Natalka Park lawn
          address: Naberezhno-Luhova St, Kyiv
          location:
            lat: 50.4825
            lng: 30.5181
        startsAt: '2026-10-17T19:00:00+03:00'
        endsAt: '2026-10-17T21:30:00+03:00'
        source: organization
        status: published
    Venue:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        address:
          type: string
        location:
          type: object
          properties:
            lat:
              type: number
            lng:
              type: number
          required:
            - lat
            - lng
      required:
        - id
        - name
        - address
        - location
      description: Where an event takes place
    EventSource:
      type: string
      enum:
        - organization
        - import
      description: 'Who added the event: a verified organization or the importer'
    EventStatus:
      type: string
      enum:
        - published
        - cancelled
    PageInfo:
      type: object
      properties:
        limit:
          type: integer
        offset:
          type: integer
        hasMore:
          type: boolean
          description: Whether another page follows
      required:
        - limit
        - offset
        - hasMore
      example:
        limit: 20
        offset: 0
        hasMore: false
    CreateEventBody:
      type: object
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 120
          description: Title shown in the catalog
        description:
          type: string
          maxLength: 5000
          description: Can be empty
        categoryId:
          type: string
          format: uuid
          description: An active category from listCategories
        venueId:
          type: string
          format: uuid
          description: One of the organization's own venues
        startsAt:
          type: string
          format: date-time
          description: Start time with an offset, e.g. 2026-10-25T19:00:00+03:00
        endsAt:
          type: string
          format: date-time
          description: End time with an offset; must be after startsAt
      required:
        - title
        - description
        - categoryId
        - venueId
        - startsAt
        - endsAt
      additionalProperties: false
      description: All editable fields of an event; PUT /events/{id} takes the same body
      example:
        title: Film quiz night
        description: Teams of up to four, questions on Ukrainian cinema.
        categoryId: 2d8b4f6c-0e3a-4c5d-9f7b-9a4c6e8d0f03
        venueId: 5a1c3e5f-7b9d-4f1a-8c3e-5f7a9b1d3e05
        startsAt: '2026-10-25T19:00:00+03:00'
        endsAt: '2026-10-25T21:00:00+03:00'
    AccessTokenResponse:
      type: object
      properties:
        accessToken:
          type: string
          description: 'Send as `Authorization: Bearer <accessToken>`'
        tokenType:
          type: string
          enum:
            - Bearer
        expiresIn:
          type: integer
          description: Seconds until the token expires
      required:
        - accessToken
        - tokenType
        - expiresIn
      example:
        accessToken: eyJhbGciOiJIUzI1NiIs…
        tokenType: Bearer
        expiresIn: 3600
    GoogleIdTokenBody:
      type: object
      properties:
        idToken:
          type: string
          minLength: 1
          maxLength: 4096
          description: The ID token Google Sign-In returned on the device
      required:
        - idToken
      additionalProperties: false
      example:
        idToken: eyJhbGciOiJSUzI1NiIs…
    SessionTokensResponse:
      type: object
      properties:
        accessToken:
          type: string
          description: 'Send as `Authorization: Bearer <accessToken>`'
        tokenType:
          type: string
          enum:
            - Bearer
        expiresIn:
          type: integer
          description: Seconds until the token expires
        refreshToken:
          type: string
          description: >-
            Renews the access token with `refreshSession`; valid for 30 days,
            and replaced by every renewal
      required:
        - accessToken
        - tokenType
        - expiresIn
        - refreshToken
      example:
        accessToken: eyJhbGciOiJIUzI1NiIs…
        tokenType: Bearer
        expiresIn: 3600
        refreshToken: <session id>.<secret>
    CompleteRegistrationBody:
      type: object
      properties:
        dateOfBirth:
          type: string
          format: date
          description: 'Checked on the server: at least 18 years old'
      required:
        - dateOfBirth
      additionalProperties: false
      example:
        dateOfBirth: '2000-05-17'
    RefreshSessionBody:
      type: object
      properties:
        refreshToken:
          type: string
          minLength: 1
          maxLength: 256
          description: The refresh token from the last sign-in or renewal
      required:
        - refreshToken
      additionalProperties: false
      example:
        refreshToken: <session id>.<secret>
    ListingsPage:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Listing'
        page:
          $ref: '#/components/schemas/PageInfo'
      required:
        - items
        - page
      example:
        items:
          - id: 9e4a6c8d-0f2b-4d4e-8a6c-8d0f2b4d6e09
            author:
              username: olena_k
              displayName: Olena
            category:
              id: 1c7a3e5b-9d2f-4b4c-8e6a-8f3b5d7c9e02
              name: Exhibitions
            eventId: null
            title: Looking for company for an exhibition on Saturday
            description: Planning to go in the evening, happy to grab a coffee after.
            date: '2026-10-17'
            status: active
        page:
          limit: 20
          offset: 0
          hasMore: false
    Listing:
      type: object
      properties:
        id:
          type: string
          format: uuid
        author:
          $ref: '#/components/schemas/ListingAuthor'
        category:
          $ref: '#/components/schemas/Category'
        eventId:
          type: string
          nullable: true
          format: uuid
          description: The catalog event the listing is about, if any
        title:
          type: string
        description:
          type: string
        date:
          type: string
          format: date
        status:
          $ref: '#/components/schemas/ListingStatus'
      required:
        - id
        - author
        - category
        - eventId
        - title
        - description
        - date
        - status
      description: A "looking for company" post
      example:
        id: 9e4a6c8d-0f2b-4d4e-8a6c-8d0f2b4d6e09
        author:
          username: olena_k
          displayName: Olena
        category:
          id: 1c7a3e5b-9d2f-4b4c-8e6a-8f3b5d7c9e02
          name: Exhibitions
        eventId: null
        title: Looking for company for an exhibition on Saturday
        description: Planning to go in the evening, happy to grab a coffee after.
        date: '2026-10-17'
        status: active
    ListingAuthor:
      type: object
      properties:
        username:
          type: string
        displayName:
          type: string
      required:
        - username
        - displayName
      description: Who posted the listing; never their contacts
    ListingStatus:
      type: string
      enum:
        - active
        - removed
    CreateListingBody:
      type: object
      properties:
        categoryId:
          type: string
          format: uuid
          description: An active category from listCategories
        eventId:
          type: string
          format: uuid
          description: A catalog event the listing is about
        title:
          type: string
          minLength: 1
          maxLength: 120
          description: Title shown in the listing feed
        description:
          type: string
          maxLength: 2000
          description: Can be empty
        date:
          type: string
          format: date
          description: The day, Kyiv time; today or later
      required:
        - categoryId
        - title
        - description
        - date
      additionalProperties: false
      example:
        categoryId: 1c7a3e5b-9d2f-4b4c-8e6a-8f3b5d7c9e02
        eventId: a7d4e0b2-1c3f-4b5a-8e9d-0f2c4b6a8d1e
        title: Looking for company for the Arsenal exhibition
        description: Planning to go in the evening, happy to grab a coffee after.
        date: '2026-10-20'
    InterestList:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Interest'
      required:
        - items
      example:
        items:
          - id: b1d2c3e4-5f60-4a71-8b82-1a2b3c4d5e01
            name: Books
    Interest:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
      required:
        - id
        - name
      description: An interest from the fixed list users pick from
      example:
        id: b1d2c3e4-5f60-4a71-8b82-1a2b3c4d5e01
        name: Books
    Profile:
      type: object
      properties:
        username:
          type: string
        displayName:
          type: string
        description:
          type: string
        occupation:
          type: string
          description: What the user does, e.g. their studies or work; can be empty
        communicationFormat:
          type: string
          nullable: true
          enum:
            - friends
            - dating
            - company
            - null
          description: Null until the user picks one
        sharePhone:
          type: boolean
          description: Whether the phone number is revealed on a mutual match
        age:
          type: integer
          description: >-
            Whole years, computed from the account’s date of birth; the date
            itself is never returned
        interests:
          type: array
          items:
            $ref: '#/components/schemas/Interest'
        linkedAccounts:
          type: array
          items:
            $ref: '#/components/schemas/LinkedAccount'
          description: Revealed to a mutual match, in the order of SocialNetwork
        isComplete:
          type: boolean
          description: >-
            True once communicationFormat, at least one interest and at least
            one linked account are set; matching needs all three
      required:
        - username
        - displayName
        - description
        - occupation
        - communicationFormat
        - sharePhone
        - age
        - interests
        - linkedAccounts
        - isComplete
      description: The signed-in user’s own profile
      example:
        username: olena_k
        displayName: Olena
        description: Cinema, galleries and long walks.
        occupation: Student at Kyiv-Mohyla Academy
        communicationFormat: friends
        sharePhone: true
        age: 28
        interests:
          - id: b1d2c3e4-5f60-4a71-8b82-1a2b3c4d5e01
            name: Books
        linkedAccounts:
          - network: telegram
            username: olena_k
            url: https://t.me/olena_k
        isComplete: true
    LinkedAccount:
      type: object
      properties:
        network:
          $ref: '#/components/schemas/SocialNetwork'
        username:
          type: string
          description: The handle, without "@"; for WhatsApp, the phone number digits
        url:
          type: string
          description: The profile link a mutual match opens
      required:
        - network
        - username
        - url
      description: A social network the user shares with a mutual match
      example:
        network: telegram
        username: olena_k
        url: https://t.me/olena_k
    SocialNetwork:
      type: string
      enum:
        - telegram
        - instagram
        - whatsapp
        - tiktok
        - facebook
      description: A social network whose handle a mutual match sees
    CreateProfileBody:
      type: object
      properties:
        username:
          type: string
          pattern: ^[A-Za-z0-9][A-Za-z0-9._]{2,29}$
          description: >-
            Unique, case-insensitive; 3 to 30 letters, digits, dots or
            underscores
        displayName:
          type: string
          minLength: 1
          maxLength: 50
          description: The name other users see
      required:
        - username
        - displayName
      additionalProperties: false
      description: The first onboarding step; everything else is added with PATCH
      example:
        username: olena_k
        displayName: Olena
    UpdateProfileBody:
      type: object
      properties:
        displayName:
          type: string
          minLength: 1
          maxLength: 50
          description: The name other users see
        username:
          type: string
          pattern: ^[A-Za-z0-9][A-Za-z0-9._]{2,29}$
          description: >-
            Unique, case-insensitive; 3 to 30 letters, digits, dots or
            underscores
        description:
          type: string
          maxLength: 500
          description: Free text about the user; can be empty
        occupation:
          type: string
          maxLength: 100
          description: What the user does, e.g. their studies or work; can be empty
        communicationFormat:
          $ref: '#/components/schemas/CommunicationFormat'
        sharePhone:
          type: boolean
          description: Whether the phone number is revealed on a mutual match
      additionalProperties: false
      description: Only the fields to change; at least one
      example:
        communicationFormat: friends
    CommunicationFormat:
      type: string
      enum:
        - friends
        - dating
        - company
      description: What the user is looking for when they go to an event
    ReplaceInterestsBody:
      type: object
      properties:
        interestIds:
          type: array
          items:
            type: string
            format: uuid
          maxItems: 30
          description: >-
            Ids from listInterests; the whole set is replaced, so an empty list
            clears it
      required:
        - interestIds
      additionalProperties: false
      example:
        interestIds:
          - b1d2c3e4-5f60-4a71-8b82-1a2b3c4d5e01
    ReplaceLinkedAccountsBody:
      type: object
      properties:
        linkedAccounts:
          type: array
          items:
            type: object
            properties:
              network:
                $ref: '#/components/schemas/SocialNetwork'
              username:
                type: string
                maxLength: 200
                description: >-
                  A nickname with or without "@", or a profile link; for
                  WhatsApp, a phone number. Kept as the bare handle; one that
                  does not fit is INVALID_SOCIAL_HANDLE
            required:
              - network
              - username
            additionalProperties: false
          maxItems: 5
          description: >-
            The whole set, at most one per social network; an empty list is
            CONTACT_REQUIRED, since a mutual match needs a contact
      required:
        - linkedAccounts
      additionalProperties: false
      example:
        linkedAccounts:
          - network: telegram
            username: '@olena_k'
    HealthResponse:
      type: object
      properties:
        status:
          type: string
          enum:
            - ok
      required:
        - status
      description: Returned while the API is up
      example:
        status: ok
  parameters: {}
paths:
  /api/v1/admin/categories:
    get:
      operationId: adminListCategories
      summary: List all categories
      description: >-
        List all categories, including inactive ones, to manage the directory.
        To pick a category for an event or listing, use listCategories. Needs an
        administrator account; other accounts get 404.
      tags:
        - Categories
      security:
        - bearerAuth: []
      responses:
        '200':
          description: All categories, active or not
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminCategoryList'
        '401':
          description: No access token, or an invalid or expired one
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Not found, or the caller is not an administrator
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    post:
      operationId: adminCreateCategory
      summary: Add a category
      description: Add a category. Needs an administrator account; other accounts get 404.
      tags:
        - Categories
      security:
        - bearerAuth: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCategoryBody'
      responses:
        '201':
          description: The new category
          headers:
            Location:
              description: URL of the created object
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminCategory'
        '400':
          description: The request is invalid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: No access token, or an invalid or expired one
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Not found, or the caller is not an administrator
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Another category already has this name
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/admin/categories/{id}:
    get:
      operationId: adminGetCategory
      summary: Get a category
      description: >-
        Get one category, including whether it is active. Needs an administrator
        account; other accounts get 404.
      tags:
        - Categories
      security:
        - bearerAuth: []
      parameters:
        - schema:
            type: string
            format: uuid
            description: Category id
          required: true
          description: Category id
          name: id
          in: path
      responses:
        '200':
          description: The category
