              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/matches/{id}/decline:
    post:
      operationId: declineMatch
      summary: Decline a proposed match
      description: >-
        Decline the proposal, even after accepting it. Both users return to the
