      description: >-
        Withdraw one of the caller’s applications; withdrawing it again changes
        nothing. A proposal still waiting for an answer is cancelled, and the
        other user returns to the pool. The caller can apply to the same event
        again later. Needs a signed-in account; a guest token gets 401.
      tags:
