    CommunicationFormat:
      type: string
      enum:
        - friends
        - dating
        - company
      description: What the user is looking for when they go to an event
    AfterEventPlan:
      type: string
      enum:
        - walk
        - coffee
        - dinner
      description: Something to do together after the event
    ApplicationStatus:
      type: string
      enum:
        - in_pool
        - paired
        - paused
        - removed
        - withdrawn
        - no_match
        - cancelled
      description: >-
        `in_pool`: waiting for a match. `paired`: a match is proposed. `paused`:
        a proposal went unanswered, waiting for the user to continue. `removed`:
        a second proposal went unanswered. `withdrawn`: the user left the pool.
        `no_match`: no match was found before the event. `cancelled`: the event
        was cancelled or the user banned
