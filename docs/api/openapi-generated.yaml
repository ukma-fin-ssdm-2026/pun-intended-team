        - items
        - page
      example:
        items:
          - id: 2b4d6f8a-0c1e-4a3b-9d5f-7a9c1e3b5d70
            type: report_received
            payload: {}
            readAt: null
            createdAt: '2026-11-15T10:00:00.000Z'
        page:
          limit: 20
          offset: 0
          hasMore: false
    Notification:
      type: object
      properties:
        id:
          type: string
          format: uuid
        type:
          $ref: '#/components/schemas/NotificationType'
        payload:
          type: object
          additionalProperties:
            nullable: true
          description: >-
            Details by type, never contact details; `report_received` has none,
            so `{}`. `event_changed`: `eventId`, `applicationId`, `change`
            (`cancelled` or `rescheduled`) and `sessions`, the days of the
            application that changed as `{ from, to }`, where `to` is the new
            start or null when the day is no longer on, `applicationCancelled`,
            true when the change cancelled the application, and `match` `{ id,
            cancelled }` when the application has a mutual match
        readAt:
          type: string
          nullable: true
          format: date-time
          description: When the caller first marked it read; null while unread
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - type
        - payload
        - readAt
        - createdAt
      description: One row of the caller’s inbox
      example:
        id: 2b4d6f8a-0c1e-4a3b-9d5f-7a9c1e3b5d70
        type: report_received
        payload: {}
        readAt: null
        createdAt: '2026-11-15T10:00:00.000Z'
    NotificationType:
      type: string
      enum:
        - match_proposed
        - match_mutual
        - respond_soon
        - not_a_match
        - continue_matching
        - removed_from_matching
        - no_match_found
        - event_reminder
        - event_changed
        - report_received
      description: >-
        What the notification is about; the app picks the text by it.
        `report_received`: a report was filed
    RegisterPushTokenBody:
      type: object
      properties:
        pushToken:
          type: string
          maxLength: 200
          pattern: ^Expo(nent)?PushToken\[[^\]]+\]$
          description: >-
            The Expo push token of the app on this device, from
            getExpoPushTokenAsync; never returned
        platform:
          type: string
          enum:
            - ios
            - android
          description: ios or android
      required:
        - pushToken
        - platform
      additionalProperties: false
      description: The push token of the device this session runs on
      example:
        pushToken: ExponentPushToken[xxxxxxxxxxxxxxxxxxxxxx]
        platform: android
    InterestList:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Interest'
      required:
        - items
      example:
        items:
          - id: b1d2c3e4-5f60-4a71-8b82-1a2b3c4d5e01
            name: Книги
            group: Книги й комікси
    Profile:
      type: object
      properties:
        username:
          type: string
        displayName:
          type: string
        description:
          type: string
        occupation:
          type: string
          description: What the user does, e.g. their studies or work; can be empty
        communicationFormat:
          type: string
          nullable: true
          enum:
            - friends
            - dating
            - company
            - null
          description: Null until the user picks one
        gender:
          type: string
          nullable: true
          enum:
            - female
            - male
            - other
            - null
          description: Null until the user picks one; matching needs it
        genderDescription:
          type: string
          nullable: true
          description: >-
            The user’s own words for the gender `other`; null for any other
            gender
        sharePhone:
          type: boolean
          description: Whether the phone number is revealed on a mutual match
        age:
          type: integer
          description: >-
            Whole years, computed from the account’s date of birth; the date
            itself is never returned
        interests:
          type: array
          items:
            $ref: '#/components/schemas/Interest'
        linkedAccounts:
          type: array
          items:
            $ref: '#/components/schemas/LinkedAccount'
          description: Revealed to a mutual match, in the order of SocialNetwork
        isComplete:
          type: boolean
          description: >-
            True once communicationFormat, gender, at least one interest and at
            least one linked account are set; matching needs all four
        photo:
          type: object
          nullable: true
          properties:
            id:
              type: string
              format: uuid
              description: Get the picture with getImage
            width:
              type: integer
            height:
              type: integer
          required:
            - id
            - width
            - height
          description: The avatar, a square shown as a circle; null shows the initial
          example:
            id: 4f1d2c3b-6a5e-4d7c-9b8a-1e2f3a4b5c6d
            width: 512
            height: 512
        cover:
          type: object
          nullable: true
          properties:
            id:
              type: string
              format: uuid
              description: Get the picture with getImage
            width:
              type: integer
            height:
              type: integer
            crop:
              type: object
              properties:
                left:
                  type: integer
                top:
                  type: integer
                width:
                  type: integer
                height:
                  type: integer
              required:
                - left
                - top
                - width
                - height
              description: >-
                The area the user picked (390:200). A screen of another shape
                shows more of the picture around it, or less
          required:
            - id
            - width
            - height
            - crop
          description: The picture behind the avatar; null shows the default gradient
          example:
            id: 6a7b8c9d-0e1f-4a2b-8c3d-4e5f6a7b8c9d
            width: 2560
            height: 1920
            crop:
              left: 0
              top: 640
              width: 2560
              height: 1313
        safetyNotice:
          $ref: '#/components/schemas/SafetyNoticeState'
      required:
        - username
        - displayName
        - description
        - occupation
        - communicationFormat
        - gender
        - genderDescription
        - sharePhone
        - age
        - interests
        - linkedAccounts
        - isComplete
        - photo
        - cover
        - safetyNotice
      description: The signed-in user’s own profile
      example:
        username: olena_k
        displayName: Olena
        description: Cinema, galleries and long walks.
        occupation: Student at Kyiv-Mohyla Academy
        communicationFormat: friends
        gender: female
        genderDescription: null
        sharePhone: true
        age: 28
        interests:
          - id: b1d2c3e4-5f60-4a71-8b82-1a2b3c4d5e01
            name: Книги
            group: Книги й комікси
        linkedAccounts:
          - network: telegram
            username: olena_k
            url: https://t.me/olena_k
        isComplete: true
        photo: null
        cover: null
        safetyNotice: acknowledged
    SafetyNoticeState:
      type: string
      enum:
        - not_acknowledged
        - acknowledged
        - hidden
      description: >-
        Where the user is with the safety notice: `not_acknowledged` holds the
        contacts of their matches back; `acknowledged` has the app show it once
        on each mutual match; `hidden` after "don’t show again"
    CreateProfileBody:
      type: object
      properties:
        username:
          type: string
          pattern: ^[A-Za-z0-9][A-Za-z0-9._]{2,29}$
          description: >-
            Unique, case-insensitive; 3 to 30 letters, digits, dots or
            underscores
        displayName:
          type: string
          minLength: 1
          maxLength: 50
          description: The name other users see
      required:
        - username
        - displayName
      additionalProperties: false
      description: The first onboarding step; everything else is added with PATCH
      example:
        username: olena_k
        displayName: Olena
    UpdateProfileBody:
      type: object
      properties:
        displayName:
          type: string
          minLength: 1
          maxLength: 50
          description: The name other users see
        username:
          type: string
          pattern: ^[A-Za-z0-9][A-Za-z0-9._]{2,29}$
          description: >-
            Unique, case-insensitive; 3 to 30 letters, digits, dots or
            underscores
        description:
          type: string
          maxLength: 500
          description: Free text about the user; can be empty
        occupation:
          type: string
          maxLength: 100
          description: What the user does, e.g. their studies or work; can be empty
        communicationFormat:
          $ref: '#/components/schemas/CommunicationFormat'
        gender:
          $ref: '#/components/schemas/Gender'
        genderDescription:
          type: string
          minLength: 1
          maxLength: 50
          description: >-
            The user’s own words for the gender `other`; required with it and
            refused with any other gender
        sharePhone:
          type: boolean
          description: Whether the phone number is revealed on a mutual match
      additionalProperties: false
      description: Only the fields to change; at least one
      example:
        communicationFormat: friends
    Gender:
      type: string
      enum:
        - female
        - male
        - other
      description: >-
        The user’s gender; `other` comes with `genderDescription`, the user’s
        own words for it
    ReplaceInterestsBody:
      type: object
      properties:
        interestIds:
          type: array
          items:
            type: string
            format: uuid
          maxItems: 30
          description: >-
            Ids from listInterests; the whole set is replaced, so an empty list
            clears it
      required:
        - interestIds
      additionalProperties: false
      example:
        interestIds:
          - b1d2c3e4-5f60-4a71-8b82-1a2b3c4d5e01
    ReplaceLinkedAccountsBody:
      type: object
      properties:
        linkedAccounts:
          type: array
          items:
            type: object
            properties:
              network:
                $ref: '#/components/schemas/SocialNetwork'
              username:
                type: string
                maxLength: 200
                description: >-
                  A nickname with or without "@", or a profile link; for
                  WhatsApp, a phone number. Kept as the bare handle; one that
                  does not fit is INVALID_SOCIAL_HANDLE
            required:
              - network
              - username
            additionalProperties: false
          maxItems: 5
          description: >-
            The whole set, at most one per social network; an empty list is
            CONTACT_REQUIRED, since a mutual match needs a contact
      required:
        - linkedAccounts
      additionalProperties: false
      example:
        linkedAccounts:
          - network: telegram
            username: '@olena_k'
    AcknowledgeSafetyNoticeBody:
      type: object
      properties:
        dontShowAgain:
          type: boolean
          description: >-
            True when the user ticked "don’t show again"; false keeps showing it
            on the next matches
      required:
        - dontShowAgain
      additionalProperties: false
      example:
        dontShowAgain: false
    HealthResponse:
      type: object
      properties:
        status:
          type: string
          enum:
            - healthy
            - unhealthy
          description: healthy only while every dependency in checks is up
        checks:
          type: object
          properties:
            database:
              type: string
              enum:
                - up
                - down
          required:
            - database
          description: >-
            Each dependency the API needs, up or down; the cause of a failure is
            only logged
      required:
        - status
        - checks
      description: Whether the API and the dependencies it needs are up
      example:
        status: healthy
        checks:
          database: up
  parameters: {}
paths:
  /api/v1/admin/accounts:
    get:
      operationId: adminListAccounts
      summary: List accounts
      description: >-
        List accounts, newest first: users and administrators, with their
        profile and organization status. The phone number and the date of birth
        are never returned, only the age. Needs an administrator account; other
        accounts get 404.
      tags:
        - Admin
      security:
        - bearerAuth: []
      parameters:
        - schema:
            type: integer
            minimum: 1
            maximum: 20
            default: 20
            description: Items per page, at most 20
          required: false
          description: Items per page, at most 20
          name: limit
          in: query
        - schema:
            type: integer
            nullable: true
            minimum: 0
            default: 0
            description: Items to skip
          required: false
          description: Items to skip
          name: offset
          in: query
        - schema:
            type: string
            minLength: 1
            maxLength: 100
            description: An account id, or part of a username or display name, in any case
          required: false
          description: An account id, or part of a username or display name, in any case
          name: search
          in: query
        - schema:
            type: string
            enum:
              - user
              - admin
            description: Only accounts with this role; `admin` lists the administrators
          required: false
          description: Only accounts with this role; `admin` lists the administrators
          name: role
          in: query
        - schema:
            type: string
            enum:
              - pending
              - active
              - banned
            description: Only accounts in this status
          required: false
          description: Only accounts in this status
          name: status
          in: query
      responses:
        '200':
          description: A page of accounts
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminAccountsPage'
        '400':
          description: The request is invalid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: No access token, or an invalid or expired one
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Not found, or the caller is not an administrator
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/admin/accounts/{id}:
    get:
      operationId: adminGetAccount
      summary: Get an account
      description: >-
        Get one account with its profile, as other users see it, and its
        organization request. Needs an administrator account; other accounts get
        404.
      tags:
        - Admin
      security:
        - bearerAuth: []
      parameters:
        - schema:
            type: string
            format: uuid
            description: Account id
          required: true
          description: Account id
          name: id
          in: path
      responses:
        '200':
          description: The account
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminAccountDetails'
        '400':
          description: The request is invalid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: No access token, or an invalid or expired one
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: No account with this id, or the caller is not an administrator
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/admin/backups:
    get:
      operationId: adminListBackups
      summary: List the nightly database backups
      description: >-
        Tell whether the nightly database backups are up to date and list the
        last 30 nights. A failed night carries a reason code only; hosts, users
        and error messages stay in the server log. Needs an administrator
        account; other accounts get 404.
      tags:
        - Admin
      security:
        - bearerAuth: []
      responses:
        '200':
          description: The status and the last nights
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BackupHistory'
        '401':
          description: No access token, or an invalid or expired one
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Not found, or the caller is not an administrator
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/admin/stats:
    get:
      operationId: adminGetStats
      summary: Get platform statistics
      description: >-
        Count active users, upcoming events, matches and open report cases, and
        tell whether the nightly database backups are up to date. Needs an
        administrator account; other accounts get 404.
      tags:
        - Admin
      security:
        - bearerAuth: []
      responses:
        '200':
          description: The current counts
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlatformStats'
        '401':
          description: No access token, or an invalid or expired one
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Not found, or the caller is not an administrator
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/admin/categories:
    get:
      operationId: adminListCategories
      summary: List all categories
      description: >-
        List all categories, including inactive ones, to manage the directory.
        To pick a category for an event or listing, use listCategories. Needs an
        administrator account; other accounts get 404.
      tags:
        - Categories
      security:
        - bearerAuth: []
      responses:
        '200':
          description: All categories, active or not
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminCategoryList'
        '401':
          description: No access token, or an invalid or expired one
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Not found, or the caller is not an administrator
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    post:
      operationId: adminCreateCategory
      summary: Add a category
      description: >-
        Add a category. The server makes its slug from the name, transliterated
        to Latin (Майстер-класи → maister-klasy), with a number added if another
        category has it (maister-klasy-2). Needs an administrator account; other
        accounts get 404.
      tags:
        - Categories
      security:
        - bearerAuth: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCategoryBody'
      responses:
        '201':
          description: The new category
          headers:
            Location:
              description: URL of the created object
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminCategory'
        '400':
          description: The request is invalid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: No access token, or an invalid or expired one
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Not found, or the caller is not an administrator
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: >-
            Another category already has this name, compared regardless of case,
            spaces and apostrophe
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/admin/categories/{id}:
    get:
      operationId: adminGetCategory
      summary: Get a category
      description: >-
        Get one category, including whether it is active. Needs an administrator
        account; other accounts get 404.
      tags:
        - Categories
      security:
        - bearerAuth: []
      parameters:
        - schema:
            type: string
            format: uuid
            description: Category id
          required: true
          description: Category id
          name: id
          in: path
      responses:
        '200':
          description: The category
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminCategory'
        '400':
          description: The request is invalid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: No access token, or an invalid or expired one
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: No category with this id, or the caller is not an administrator
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    patch:
      operationId: adminUpdateCategory
      summary: Rename, deactivate or reactivate a category
      description: >-
        Change the name or whether the category is active. The slug stays as it
        was made. Needs an administrator account; other accounts get 404.
      tags:
        - Categories
      security:
        - bearerAuth: []
      parameters:
        - schema:
            type: string
            format: uuid
            description: Category id
          required: true
          description: Category id
          name: id
          in: path
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateCategoryBody'
      responses:
        '200':
          description: The updated category
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminCategory'
        '400':
          description: The request is invalid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: No access token, or an invalid or expired one
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: No category with this id, or the caller is not an administrator
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: >-
            Another category already has this name, compared regardless of case,
            spaces and apostrophe
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    delete:
      operationId: adminDeleteCategory
      summary: Delete an unused category
      description: >-
        Delete an unused category. Needs an administrator account; other
        accounts get 404.
      tags:
        - Categories
      security:
        - bearerAuth: []
      parameters:
        - schema:
            type: string
            format: uuid
            description: Category id
          required: true
          description: Category id
          name: id
          in: path
      responses:
        '204':
          description: The category was deleted
        '400':
          description: The request is invalid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: No access token, or an invalid or expired one
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: No category with this id, or the caller is not an administrator
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: An event or listing uses the category; deactivate it instead
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/admin/events:
    get:
      operationId: adminListEvents
      summary: List all events
      description: >-
        List every event, imported or added by an organization, published or
        cancelled, upcoming or past. For the catalog users see, use listEvents.
        Needs an administrator account; other accounts get 404.
      tags:
        - Events
      security:
        - bearerAuth: []
      parameters:
        - schema:
            type: integer
            minimum: 1
            maximum: 20
            default: 20
            description: Items per page, at most 20
          required: false
          description: Items per page, at most 20
          name: limit
          in: query
        - schema:
            type: integer
            nullable: true
            minimum: 0
            default: 0
            description: Items to skip
          required: false
          description: Items to skip
          name: offset
          in: query
        - schema:
            type: string
            enum:
              - upcoming
              - past
            default: upcoming
            description: >-
              `upcoming`: not ended yet, soonest first. `past`: ended, latest
              first
          required: false
          description: >-
            `upcoming`: not ended yet, soonest first. `past`: ended, latest
            first
          name: period
          in: query
        - schema:
            type: string
            minLength: 1
            maxLength: 100
            description: Part of the title, in any case
          required: false
          description: Part of the title, in any case
          name: search
          in: query
        - schema:
            $ref: '#/components/schemas/EventSource'
          required: false
          description: 'Who added the event: a verified organization or the importer'
          name: source
          in: query
        - schema:
            $ref: '#/components/schemas/EventStatus'
          required: false
          name: status
          in: query
        - schema:
            type: string
            format: uuid
            description: Only events of this organization, by its account id
          required: false
          description: Only events of this organization, by its account id
          name: organizationId
          in: query
        - schema:
            type: string
            format: uuid
            description: Only events at this venue
          required: false
          description: Only events at this venue
          name: venueId
          in: query
        - schema:
            type: string
            format: uuid
            description: Only events of this category, active or not
          required: false
          description: Only events of this category, active or not
          name: categoryId
          in: query
      responses:
        '200':
          description: A page of events
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminEventsPage'
        '400':
          description: The request is invalid
          content:
            application/json:
              schema:
