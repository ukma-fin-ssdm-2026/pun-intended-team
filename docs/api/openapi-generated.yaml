  /api/v1/events:
    get:
      operationId: listEvents
      summary: Browse the event catalog
      description: >-
        Browse the event catalog: published events in the catalog window,
        soonest first. Filters combine: an event shows when it is in any of
        `categoryIds`, at `venueId`, within `radiusKm` of `lat`, `lng` and on
        the days from `from` to `to`. `lastUpdatedAt` is not null while the
        imported events are those of an earlier import run, or of a run more
        than 30 hours ago (FR-014). Needs an access token: a guest token or a
        signed-in account.
      tags:
        - Events
      security:
        - bearerAuth: []
      parameters:
        - schema:
            type: integer
            minimum: 1
            maximum: 20
            default: 20
            description: Items per page, at most 20
          required: false
          description: Items per page, at most 20
          name: limit
          in: query
        - schema:
            type: integer
            nullable: true
            minimum: 0
            default: 0
            description: Items to skip
          required: false
          description: Items to skip
          name: offset
          in: query
        - schema:
            type: array
            items:
              type: string
              format: uuid
            minItems: 1
            maxItems: 20
            description: >-
              Only events of any of these categories, at most 20: repeated
              (`categoryIds=a&categoryIds=b`) or comma-separated
              (`categoryIds=a,b`). An unknown id matches no event
          required: false
          description: >-
            Only events of any of these categories, at most 20: repeated
            (`categoryIds=a&categoryIds=b`) or comma-separated
            (`categoryIds=a,b`). An unknown id matches no event
          name: categoryIds
          in: query
        - schema:
            type: string
            format: uuid
            description: Only events at this venue, e.g. after tapping its map pin
          required: false
          description: Only events at this venue, e.g. after tapping its map pin
          name: venueId
          in: query
        - schema:
            type: number
            nullable: true
            minimum: -90
            maximum: 90
            description: Latitude of the point; only with lng and radiusKm
          required: false
          description: Latitude of the point; only with lng and radiusKm
          name: lat
          in: query
        - schema:
            type: number
            nullable: true
            minimum: -180
            maximum: 180
            description: Longitude of the point; only with lat and radiusKm
          required: false
          description: Longitude of the point; only with lat and radiusKm
          name: lng
          in: query
        - schema:
            type: number
            minimum: 0
            exclusiveMinimum: true
            maximum: 50
            description: >-
              Only events whose venue is within this many kilometres of lat,
              lng; at most 50
          required: false
          description: >-
            Only events whose venue is within this many kilometres of lat, lng;
            at most 50
          name: radiusKm
          in: query
        - schema:
            type: string
            format: date
            description: First day, Kyiv time; earlier dates count as today
          required: false
          description: First day, Kyiv time; earlier dates count as today
          name: from
          in: query
        - schema:
            type: string
            format: date
            description: >-
              Last day, Kyiv time; later dates count as the end of the catalog
              window
          required: false
          description: >-
            Last day, Kyiv time; later dates count as the end of the catalog
            window
          name: to
          in: query
      responses:
        '200':
          description: A page of events
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventsPage'
        '400':
          description: The request is invalid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: No access token, or an invalid or expired one
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    post:
      operationId: createEvent
