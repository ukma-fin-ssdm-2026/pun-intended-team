    Event:
      type: object
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        description:
          type: string
        category:
          $ref: '#/components/schemas/Category'
        venue:
          $ref: '#/components/schemas/Venue'
        startsAt:
          type: string
          format: date-time
        startTimeKnown:
          type: boolean
          description: >-
            False when the provider gives no time of day: startsAt is then a
            default opening time (12:00 Europe/Kyiv for exhibitions) that only
            orders the event and its sessions; show the dates without a time.
            Always true for an organization event
        endsAt:
          type: string
          format: date-time
        endTimeKnown:
          type: boolean
          description: >-
            False for an imported event whose provider gives no end: endsAt is
            then the end of its start day in Europe/Kyiv and only startsAt
            should be shown. Always true for an organization event
        priceMin:
          type: integer
          nullable: true
          minimum: 0
          description: >-
            The lowest ticket price in whole hryvnias. Null when the price is
            unknown: show no price. 0 with priceMax null or 0: the event is free
        priceMax:
          type: integer
          nullable: true
          minimum: 0
          description: >-
            The highest ticket price in whole hryvnias, when the tickets cost
            from priceMin to priceMax; never below priceMin. Null for one price,
            a free event or an unknown price
        imageUrl:
          type: string
          nullable: true
          description: >-
            Imported events: the provider's image URL, shown as is; null for
            organization events
        photo:
          type: object
          nullable: true
          properties:
            id:
              type: string
              format: uuid
              description: Get the picture with getImage; a guest token may
            width:
              type: integer
            height:
              type: integer
            crop:
              type: object
              properties:
                left:
                  type: integer
                top:
                  type: integer
                width:
                  type: integer
                height:
                  type: integer
              required:
                - left
                - top
                - width
                - height
              description: >-
                The area the organization picked (2:1, the catalog card). The
                event page, almost square, shows more around it
          required:
            - id
            - width
            - height
            - crop
          description: >-
            The cover an organization uploaded; null for imported events and
            without one
          example:
            id: 7b8c9d0e-1f2a-4b3c-9d4e-5f6a7b8c9d0e
            width: 2560
            height: 1707
            crop:
              left: 0
              top: 213
              width: 2560
              height: 1280
        sourceUrl:
          type: string
          nullable: true
          description: >-
            Imported events: the event's page at the provider, to credit it and
            to buy tickets; null otherwise
        source:
          $ref: '#/components/schemas/EventSource'
        status:
          $ref: '#/components/schemas/EventStatus'
      required:
        - id
        - title
        - description
        - category
        - venue
        - startsAt
        - startTimeKnown
        - endsAt
        - endTimeKnown
        - priceMin
        - priceMax
        - imageUrl
        - photo
        - sourceUrl
        - source
        - status
      description: An event users can go to together
