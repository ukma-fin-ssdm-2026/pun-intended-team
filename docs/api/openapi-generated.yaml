openapi: 3.0.3
info:
  title: Nearby API
  version: 1.1.1
  description: >-
    REST API of Nearby, an app for going to events and meeting people along the
    way.
servers:
  - url: http://localhost:4100
    description: Local development
tags:
  - name: Auth
    description: Registration, sign-in methods and guest tokens
  - name: Events
    description: Events users can go to together
  - name: Listings
    description: '"Looking for company" posts'
  - name: Matching
    description: Asking for a match at an event and leaving the pool
  - name: Profiles
    description: The signed-in user’s profile, filled in step by step during onboarding
  - name: Interests
    description: The fixed list of interests users pick from
  - name: Categories
    description: The event category directory
  - name: Organizations
    description: 'Organization status: an account requests it, administrators verify it'
  - name: Moderation
    description: Reports on users and listings, and how administrators resolve them
  - name: Admin
    description: Platform statistics and database backups for administrators
  - name: System
    description: Service endpoints
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: >-
        An access token from `/api/v1/auth/sign-in` or `/api/v1/auth/verify`, or
        a guest token from `/api/v1/auth/guest` for catalog reads.
  schemas:
    BackupHistory:
      type: object
      properties:
        status:
          type: object
          nullable: true
          properties:
            lastSucceededAt:
              type: string
              nullable: true
              format: date-time
              description: When the last nightly backup succeeded; null if none has
            overdue:
              type: boolean
              description: The last nightly backup failed, or it is more than 26 hours old
          required:
            - lastSucceededAt
            - overdue
          description: Null where no nightly backup has run, e.g. in development
        items:
          type: array
          items:
            $ref: '#/components/schemas/BackupRun'
          description: The last 30 nights, newest first
      required:
        - status
        - items
      example:
        status:
          lastSucceededAt: '2026-11-06T01:00:12.000Z'
          overdue: true
        items:
          - finishedAt: '2026-11-07T01:20:31.000Z'
            succeeded: false
            attempts: 3
            durationSeconds: 0
            sizeBytes: null
            reason: unreachable
          - finishedAt: '2026-11-06T01:00:12.000Z'
            succeeded: true
            attempts: 1
            durationSeconds: 12
            sizeBytes: 4404019
            reason: null
    BackupRun:
      type: object
      properties:
        finishedAt:
          type: string
          format: date-time
          description: 'When the night ended: the copy was kept, or the last attempt failed'
        succeeded:
          type: boolean
        attempts:
          type: integer
          description: Attempts that night, at most 3
        durationSeconds:
          type: integer
          description: How long the last attempt took
        sizeBytes:
          type: integer
          nullable: true
          description: Size of the copy; null when the night failed
        reason:
          type: string
          nullable: true
          enum:
            - unreachable
            - auth_failed
            - timeout
            - locked
            - unreadable
            - failed
            - null
          description: >-
            Why the night failed; null when it succeeded. `unreachable`: the
            database did not answer. `auth_failed`: it refused the sign-in.
            `timeout`: the copy took more than 15 minutes. `locked`: tables
            stayed locked, e.g. by a migration. `unreadable`: the copy could not
            be read back. `failed`: anything else. The details are only in the
            server log
      required:
        - finishedAt
        - succeeded
        - attempts
        - durationSeconds
        - sizeBytes
        - reason
    ErrorResponse:
      type: object
      properties:
        error:
          type: object
          properties:
            code:
              $ref: '#/components/schemas/ErrorCode'
            message:
              type: string
            details:
              type: array
              items:
                $ref: '#/components/schemas/ValidationIssue'
              description: >-
                Every invalid field, for validation errors and business rules
                that can name them
          required:
            - code
            - message
      required:
        - error
      description: The body of every error response
      example:
        error:
          code: VALIDATION_ERROR
          message: The request is invalid
          details:
            - location: params
              field: id
              message: Invalid UUID
    ErrorCode:
      type: string
      enum:
        - VALIDATION_ERROR
        - UNAUTHENTICATED
        - PAYLOAD_TOO_LARGE
        - RATE_LIMITED
        - INTERNAL_ERROR
        - SERVICE_UNAVAILABLE
        - NOT_FOUND
        - CONFLICT
        - REFERENCE_NOT_FOUND
        - ORGANIZATION_NOT_VERIFIED
        - EVENT_CANCELLED
        - EVENT_ENDS_BEFORE_START
        - APPLICATIONS_CLOSED
        - INVALID_SESSION_DAY
        - LISTING_DATE_IN_PAST
        - USERNAME_TAKEN
        - PROFILE_EXISTS
        - PROFILE_INCOMPLETE
        - ALREADY_APPLIED
        - CONTACT_REQUIRED
        - INVALID_SOCIAL_HANDLE
        - INVALID_CREDENTIALS
        - WRONG_PASSWORD
        - INVALID_GOOGLE_TOKEN
        - GOOGLE_ACCOUNT_TAKEN
        - GOOGLE_ALREADY_LINKED
        - INVALID_CODE
        - PHONE_CODES_UNAVAILABLE
        - INVALID_REFRESH_TOKEN
        - UNDERAGE
        - CANNOT_REPORT_SELF
        - CANNOT_RESOLVE_OWN_CASE
        - CANNOT_BAN_ADMIN
        - CANNOT_DECIDE_OWN_REQUEST
      description: Machine-readable code; clients branch on it, not on the message
    ValidationIssue:
      type: object
      properties:
        location:
          $ref: '#/components/schemas/ValidationLocation'
        field:
          type: string
        message:
          type: string
      required:
        - location
        - field
        - message
      description: One invalid field of the request
    ValidationLocation:
      type: string
      enum:
        - params
        - query
        - body
      description: Part of the request the invalid field is in
    PlatformStats:
      type: object
      properties:
        users:
          type: integer
          description: 'Active accounts: registered and not banned'
        events:
          type: integer
          description: Published events that have not ended yet
        matches:
          type: integer
          description: Matches proposed so far
        openReports:
          type: integer
          description: Open report cases
        backup:
          type: object
          nullable: true
          properties:
            lastSucceededAt:
              type: string
              nullable: true
              format: date-time
              description: When the last nightly backup succeeded; null if none has
            overdue:
              type: boolean
              description: The last nightly backup failed, or it is more than 26 hours old
          required:
            - lastSucceededAt
            - overdue
          description: >-
            Nightly database backups; null where none has run, e.g. in
            development
      required:
        - users
        - events
        - matches
        - openReports
        - backup
      example:
        users: 128
        events: 42
        matches: 0
        openReports: 3
        backup:
          lastSucceededAt: '2026-11-07T01:00:42.000Z'
          overdue: false
    AdminCategoryList:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/AdminCategory'
      required:
        - items
      example:
        items:
          - id: 2d8b4f6c-0e3a-4c5d-9f7b-9a4c6e8d0f03
            name: Концерти
            slug: concerts
            isActive: true
    AdminCategory:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        slug:
          type: string
          description: >-
            Made from the name when the category is added and never changed,
            also on a rename; the event import maps providers' genres to it
        isActive:
          type: boolean
          description: Inactive categories are hidden from filters and cannot be picked
      required:
        - id
        - name
        - slug
        - isActive
      description: A category as administrators see it
      example:
        id: 2d8b4f6c-0e3a-4c5d-9f7b-9a4c6e8d0f03
        name: Концерти
        slug: concerts
        isActive: true
    CreateCategoryBody:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 60
          description: >-
            Saved with runs of spaces as one and every apostrophe (' ’ ʼ) as ʼ;
            unique regardless of case, spaces and apostrophe
        isActive:
          type: boolean
          default: true
          description: Whether users can pick the category
      required:
        - name
      additionalProperties: false
      example:
        name: Майстер-класи
    UpdateCategoryBody:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 60
          description: >-
            Saved with runs of spaces as one and every apostrophe (' ’ ʼ) as ʼ;
            unique regardless of case, spaces and apostrophe
        isActive:
          type: boolean
          description: Whether users can pick the category
      additionalProperties: false
      description: Only the fields to change
      example:
        isActive: false
    CategoryList:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Category'
      required:
        - items
      example:
        items:
          - id: 2d8b4f6c-0e3a-4c5d-9f7b-9a4c6e8d0f03
            name: Концерти
    Category:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
      required:
        - id
        - name
      description: An event category from the directory administrators manage
      example:
        id: 2d8b4f6c-0e3a-4c5d-9f7b-9a4c6e8d0f03
        name: Концерти
    EventsPage:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Event'
        page:
          $ref: '#/components/schemas/PageInfo'
      required:
        - items
        - page
      example:
        items:
          - id: 3f1c2a9e-8b4d-4e2a-9c71-5d0e6b7a8f10
            title: 'Open-air film night: Shadows of Forgotten Ancestors'
            description: Screening in the park, bring a blanket.
            category:
              id: 2d8b4f6c-0e3a-4c5d-9f7b-9a4c6e8d0f03
              name: Концерти
            venue:
              id: 5a1c3e5f-7b9d-4f1a-8c3e-5f7a9b1d3e05
              name: Natalka Park lawn
              address: Naberezhno-Luhova St, Kyiv
              location:
                lat: 50.4825
                lng: 30.5181
            startsAt: '2026-10-17T19:00:00+03:00'
            endsAt: '2026-10-17T21:30:00+03:00'
            imageUrl: null
            sourceUrl: null
            source: organization
            status: published
        page:
          limit: 20
          offset: 0
          hasMore: false
    Event:
      type: object
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        description:
          type: string
        category:
          $ref: '#/components/schemas/Category'
        venue:
          $ref: '#/components/schemas/Venue'
        startsAt:
          type: string
          format: date-time
        endsAt:
          type: string
          format: date-time
        imageUrl:
          type: string
          nullable: true
          description: >-
            Imported events: the provider's image URL, shown as is; null for
            organization events
        sourceUrl:
          type: string
          nullable: true
          description: >-
            Imported events: the event's page at the provider, to credit it and
            to buy tickets; null otherwise
        source:
          $ref: '#/components/schemas/EventSource'
        status:
          $ref: '#/components/schemas/EventStatus'
      required:
        - id
        - title
        - description
        - category
        - venue
        - startsAt
        - endsAt
        - imageUrl
        - sourceUrl
        - source
        - status
      description: An event users can go to together
      example:
        id: 3f1c2a9e-8b4d-4e2a-9c71-5d0e6b7a8f10
        title: 'Open-air film night: Shadows of Forgotten Ancestors'
        description: Screening in the park, bring a blanket.
        category:
          id: 2d8b4f6c-0e3a-4c5d-9f7b-9a4c6e8d0f03
          name: Концерти
        venue:
          id: 5a1c3e5f-7b9d-4f1a-8c3e-5f7a9b1d3e05
          name: Natalka Park lawn
          address: Naberezhno-Luhova St, Kyiv
          location:
            lat: 50.4825
            lng: 30.5181
        startsAt: '2026-10-17T19:00:00+03:00'
        endsAt: '2026-10-17T21:30:00+03:00'
        imageUrl: null
        sourceUrl: null
        source: organization
        status: published
    Venue:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        address:
          type: string
        location:
          type: object
          properties:
            lat:
              type: number
            lng:
              type: number
          required:
            - lat
            - lng
      required:
        - id
        - name
        - address
        - location
      description: Where an event takes place
    EventSource:
      type: string
      enum:
        - organization
        - import
      description: 'Who added the event: a verified organization or the importer'
    EventStatus:
      type: string
      enum:
        - published
        - cancelled
    PageInfo:
      type: object
      properties:
        limit:
          type: integer
        offset:
          type: integer
        hasMore:
          type: boolean
          description: Whether another page follows
      required:
        - limit
        - offset
        - hasMore
      example:
        limit: 20
        offset: 0
        hasMore: false
    CreateEventBody:
      type: object
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 120
          description: Title shown in the catalog
        description:
          type: string
          maxLength: 5000
          description: Can be empty
        categoryId:
          type: string
          format: uuid
          description: An active category from listCategories
        venueId:
          type: string
          format: uuid
          description: One of the organization's own venues
        startsAt:
          type: string
          format: date-time
          description: Start time with an offset, e.g. 2026-10-25T19:00:00+03:00
        endsAt:
          type: string
          format: date-time
          description: End time with an offset; must be after startsAt
      required:
        - title
        - description
        - categoryId
        - venueId
        - startsAt
        - endsAt
      additionalProperties: false
      description: All editable fields of an event; PUT /events/{id} takes the same body
      example:
        title: Film quiz night
        description: Teams of up to four, questions on Ukrainian cinema.
        categoryId: 2d8b4f6c-0e3a-4c5d-9f7b-9a4c6e8d0f03
        venueId: 5a1c3e5f-7b9d-4f1a-8c3e-5f7a9b1d3e05
        startsAt: '2026-10-25T19:00:00+03:00'
        endsAt: '2026-10-25T21:00:00+03:00'
    Organization:
      type: object
      properties:
        name:
          type: string
        description:
          type: string
          nullable: true
        officialLink:
          type: string
          nullable: true
        verificationStatus:
          type: string
          enum:
            - pending
            - verified
            - rejected
            - revoked
          description: >-
            pending: waits for an administrator; only a verified organization
            publishes events
        verifiedAt:
          type: string
          nullable: true
          format: date-time
          description: When an administrator verified it; null otherwise
      required:
        - name
        - description
        - officialLink
        - verificationStatus
        - verifiedAt
      description: The caller’s organization request and its status
      example:
        name: Мистецький Арсенал
        description: 'Культурний комплекс у центрі Києва: виставки, концерти, лекції.'
        officialLink: https://artarsenal.in.ua
        verificationStatus: pending
        verifiedAt: null
    OrganizationRequestBody:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
          description: The organization’s name, as users will see it
        description:
          type: string
          minLength: 1
          maxLength: 1000
          description: What the organization does
        officialLink:
          type: string
          maxLength: 500
          format: uri
          description: >-
            The organization’s official site or page, where an administrator can
            check it
      required:
        - name
        - description
        - officialLink
      additionalProperties: false
      example:
        name: Мистецький Арсенал
        description: 'Культурний комплекс у центрі Києва: виставки, концерти, лекції.'
        officialLink: https://artarsenal.in.ua
    AccessTokenResponse:
      type: object
      properties:
        accessToken:
          type: string
          description: 'Send as `Authorization: Bearer <accessToken>`'
        tokenType:
          type: string
          enum:
            - Bearer
        expiresIn:
          type: integer
          description: Seconds until the token expires
      required:
        - accessToken
        - tokenType
        - expiresIn
      example:
        accessToken: eyJhbGciOiJIUzI1NiIs…
        tokenType: Bearer
        expiresIn: 3600
    GoogleIdTokenBody:
      type: object
      properties:
        idToken:
          type: string
          minLength: 1
          maxLength: 4096
          description: The ID token Google Sign-In returned on the device
      required:
        - idToken
      additionalProperties: false
      example:
        idToken: eyJhbGciOiJSUzI1NiIs…
    SessionTokensResponse:
      type: object
      properties:
        accessToken:
          type: string
          description: 'Send as `Authorization: Bearer <accessToken>`'
        tokenType:
          type: string
          enum:
            - Bearer
        expiresIn:
          type: integer
          description: Seconds until the token expires
        refreshToken:
          type: string
          description: >-
            Renews the access token with `refreshSession`; valid for 30 days,
            and replaced by every renewal
      required:
        - accessToken
        - tokenType
        - expiresIn
        - refreshToken
      example:
        accessToken: eyJhbGciOiJIUzI1NiIs…
        tokenType: Bearer
        expiresIn: 3600
        refreshToken: <session id>.<secret>
    CompleteRegistrationBody:
      type: object
      properties:
        dateOfBirth:
          type: string
          format: date
          description: 'Checked on the server: at least 18 years old'
      required:
        - dateOfBirth
      additionalProperties: false
      example:
        dateOfBirth: '2000-05-17'
    RefreshSessionBody:
      type: object
      properties:
        refreshToken:
          type: string
          minLength: 1
          maxLength: 256
          description: The refresh token from the last sign-in or renewal
      required:
        - refreshToken
      additionalProperties: false
      example:
        refreshToken: <session id>.<secret>
    ListingsPage:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Listing'
        page:
          $ref: '#/components/schemas/PageInfo'
      required:
        - items
        - page
      example:
        items:
          - id: 9e4a6c8d-0f2b-4d4e-8a6c-8d0f2b4d6e09
            author:
              username: olena_k
              displayName: Olena
            category:
              id: 1c7a3e5b-9d2f-4b4c-8e6a-8f3b5d7c9e02
              name: Виставки
            eventId: null
            title: Looking for company for an exhibition on Saturday
            description: Planning to go in the evening, happy to grab a coffee after.
            date: '2026-10-17'
            status: active
        page:
          limit: 20
          offset: 0
          hasMore: false
    Listing:
      type: object
      properties:
        id:
          type: string
          format: uuid
        author:
          $ref: '#/components/schemas/ListingAuthor'
        category:
          $ref: '#/components/schemas/Category'
        eventId:
          type: string
          nullable: true
          format: uuid
          description: The catalog event the listing is about, if any
        title:
          type: string
        description:
          type: string
        date:
          type: string
          format: date
        status:
          $ref: '#/components/schemas/ListingStatus'
      required:
        - id
        - author
        - category
        - eventId
        - title
        - description
        - date
        - status
      description: A "looking for company" post
      example:
        id: 9e4a6c8d-0f2b-4d4e-8a6c-8d0f2b4d6e09
        author:
          username: olena_k
          displayName: Olena
        category:
          id: 1c7a3e5b-9d2f-4b4c-8e6a-8f3b5d7c9e02
          name: Виставки
        eventId: null
        title: Looking for company for an exhibition on Saturday
        description: Planning to go in the evening, happy to grab a coffee after.
        date: '2026-10-17'
        status: active
    ListingAuthor:
      type: object
      properties:
        username:
          type: string
        displayName:
          type: string
      required:
        - username
        - displayName
      description: Who posted the listing; never their contacts
    ListingStatus:
      type: string
      enum:
        - active
        - removed
    CreateListingBody:
      type: object
      properties:
        categoryId:
          type: string
          format: uuid
          description: An active category from listCategories
        eventId:
          type: string
          format: uuid
          description: A catalog event the listing is about
        title:
          type: string
          minLength: 1
          maxLength: 120
          description: Title shown in the listing feed
        description:
          type: string
          maxLength: 2000
          description: Can be empty
        date:
          type: string
          format: date
          description: The day, Kyiv time; today or later
      required:
        - categoryId
        - title
        - description
        - date
      additionalProperties: false
      example:
        categoryId: 1c7a3e5b-9d2f-4b4c-8e6a-8f3b5d7c9e02
        eventId: a7d4e0b2-1c3f-4b5a-8e9d-0f2c4b6a8d1e
        title: Looking for company for the Arsenal exhibition
        description: Planning to go in the evening, happy to grab a coffee after.
        date: '2026-10-20'
    Application:
      type: object
      properties:
        id:
          type: string
          format: uuid
        eventId:
          type: string
          format: uuid
        sessions:
          type: array
          items:
            $ref: '#/components/schemas/ApplicationSession'
          description: >-
            The days the user can go, soonest first: the event's only session,
            or the picked days of a multi-day event
        cutoffAt:
          type: string
          format: date-time
          description: 'The last day''s cutoff: until then the application can be matched'
        desiredCompany:
          $ref: '#/components/schemas/CommunicationFormat'
        afterEventPlans:
          type: array
          items:
            $ref: '#/components/schemas/AfterEventPlan'
          description: >-
            What the user would do together after the event; empty: only the
            event
        status:
          $ref: '#/components/schemas/ApplicationStatus'
        nextRoundAt:
          type: string
          nullable: true
          format: date-time
          description: >-
            The earliest matching round still to come on any of the days; null
            when the application is not waiting in the pool or no round is left
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - eventId
        - sessions
        - cutoffAt
        - desiredCompany
        - afterEventPlans
        - status
        - nextRoundAt
        - createdAt
      description: The caller’s request to be matched in one session of an event
      example:
        id: 4c8e2a6d-0b3f-4d5e-9a7c-1e3f5b7d9a11
        eventId: a7d4e0b2-1c3f-4b5a-8e9d-0f2c4b6a8d1e
        sessions:
          - startsAt: '2026-10-24T16:00:00.000Z'
            cutoffAt: '2026-10-24T15:00:00.000Z'
          - startsAt: '2026-10-25T17:00:00.000Z'
            cutoffAt: '2026-10-25T16:00:00.000Z'
        cutoffAt: '2026-10-25T16:00:00.000Z'
        desiredCompany: company
        afterEventPlans:
          - walk
          - coffee
        status: in_pool
