          description: '`USERNAME_TAKEN`: another user has this username.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/me/profile/interests:
    put:
      operationId: replaceMyInterests
      summary: Set your interests
      description: >-
        Replace the whole set of the caller’s interests with the given ids; an
        empty list clears it. Needs a signed-in account; a guest token gets 401.
      tags:
        - Profiles
      security:
        - bearerAuth: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReplaceInterestsBody'
      responses:
        '200':
          description: The updated profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Profile'
        '400':
          description: The request is invalid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: No access token, or an invalid or expired one
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: The account has not created a profile yet
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: '`REFERENCE_NOT_FOUND`: one of the interest ids does not exist.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/me/profile/linked-accounts:
    put:
      operationId: replaceMyLinkedAccounts
      summary: Set your networks
      description: >-
        Replace the whole set of networks (Telegram, Instagram, …) a mutual
        match sees, at most one per app. At least one is required, since sign-in
        is Google-only and there is no phone number to share. Needs a signed-in
        account; a guest token gets 401.
      tags:
        - Profiles
      security:
        - bearerAuth: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReplaceLinkedAccountsBody'
      responses:
        '200':
          description: The updated profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Profile'
        '400':
          description: The request is invalid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: No access token, or an invalid or expired one
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: The account has not created a profile yet
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: >-
            `CONTACT_REQUIRED`: the list is empty. `INVALID_SOCIAL_HANDLE`: a
            username does not fit its social network; `details` names it.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /health:
    get:
      operationId: getHealth
      summary: Check that the API is running
      description: Check that the API is running. No access token needed.
      tags:
        - System
      responses:
        '200':
          description: The API is up
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
