            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: The account has not created a profile yet
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '413':
          description: The file is larger than the limit
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '415':
          description: The Content-Type is not one of the accepted file types
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: >-
            `INVALID_IMAGE`: the file is not a JPEG, PNG or WebP picture, is
