      summary: Renew the access token
      description: >-
        Renew the access token with the refresh token, without signing in again.
        The refresh token is replaced: keep the new one. If the answer is lost,
        send the old one again within 60 seconds; after that, or for any older
        token, it ends the session. No access token needed.
      tags:
        - Auth
      x-mcp: false
      requestBody:
        content:
