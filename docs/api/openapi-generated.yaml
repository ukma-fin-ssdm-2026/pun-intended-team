openapi: 3.0.3
info:
  title: Nearby API
  version: 1.2.0
  description: >-
    REST API of Nearby, an app for going to events and meeting people along the
    way.
servers:
  - url: http://localhost:4100
    description: Local development
tags:
  - name: Auth
    description: Registration, sign-in methods and guest tokens
  - name: Events
    description: Events users can go to together
  - name: Venues
    description: >-
      An organization’s own venues, where it publishes its events; all of them
      for administrators
  - name: Listings
    description: '"Looking for company" posts'
  - name: Matching
    description: Asking for a match at an event and leaving the pool
  - name: Notifications
    description: The signed-in user’s inbox
  - name: Profiles
    description: The signed-in user’s profile, filled in step by step during onboarding
  - name: Images
    description: 'Uploaded pictures: profile photos, covers and listing photos'
  - name: Interests
    description: The fixed list of interests users pick from
  - name: Categories
    description: The event category directory
  - name: Organizations
    description: 'Organization status: an account requests it, administrators verify it'
  - name: Moderation
    description: Reports on users and listings, and how administrators resolve them
  - name: Admin
    description: Accounts, platform statistics and database backups for administrators
  - name: System
    description: Service endpoints
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: >-
        An access token from `/api/v1/auth/sign-in` or `/api/v1/auth/verify`, or
        a guest token from `/api/v1/auth/guest` for catalog reads.
  schemas:
    AdminAccountsPage:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/AdminAccount'
        page:
          $ref: '#/components/schemas/PageInfo'
      required:
        - items
        - page
      example:
        items:
          - id: c3a1f6d2-4b7e-4f0a-9d21-6e8b5a3c7f14
            role: user
            status: active
            signInMethods:
              - google
            age: 25
            createdAt: '2026-10-12T09:30:00.000Z'
            profile:
              username: olena_k
              displayName: Olena
            organization: null
        page:
          limit: 20
          offset: 0
          hasMore: false
    AdminAccount:
      type: object
      properties:
        id:
          type: string
          format: uuid
        role:
          $ref: '#/components/schemas/AccountRole'
        status:
          $ref: '#/components/schemas/AccountStatus'
        signInMethods:
          type: array
          items:
            type: string
            enum:
              - google
              - password
          description: How the account signs in
        age:
          type: integer
          nullable: true
          description: Whole years; null while the account is pending
        createdAt:
          type: string
          format: date-time
          description: When the account was registered
        profile:
          type: object
          nullable: true
          properties:
            username:
              type: string
            displayName:
              type: string
          required:
            - username
            - displayName
          description: Null without a profile
        organization:
          type: object
          nullable: true
          properties:
            name:
              type: string
            verificationStatus:
              type: string
              enum:
                - pending
                - verified
                - rejected
                - revoked
          required:
            - name
            - verificationStatus
          description: Null when the account has not requested organization status
      required:
        - id
        - role
        - status
        - signInMethods
        - age
        - createdAt
        - profile
        - organization
      description: >-
        An account as administrators see it in a list: without its phone number
        and date of birth
      example:
        id: c3a1f6d2-4b7e-4f0a-9d21-6e8b5a3c7f14
        role: user
        status: active
        signInMethods:
          - google
        age: 25
        createdAt: '2026-10-12T09:30:00.000Z'
        profile:
          username: olena_k
          displayName: Olena
        organization: null
    AccountRole:
      type: string
      enum:
        - user
        - admin
    AccountStatus:
      type: string
      enum:
        - pending
        - active
        - banned
      description: >-
        `pending`: signed in with Google, has not given a date of birth yet.
        `banned`: cannot sign in
    PageInfo:
      type: object
      properties:
        limit:
          type: integer
        offset:
          type: integer
        hasMore:
          type: boolean
          description: Whether another page follows
      required:
        - limit
        - offset
        - hasMore
      example:
        limit: 20
        offset: 0
        hasMore: false
    ErrorResponse:
      type: object
      properties:
        error:
          type: object
          properties:
            code:
              $ref: '#/components/schemas/ErrorCode'
            message:
              type: string
            details:
              type: array
              items:
                $ref: '#/components/schemas/ValidationIssue'
              description: >-
                Every invalid field, for validation errors and business rules
                that can name them
          required:
            - code
            - message
      required:
        - error
      description: The body of every error response
      example:
        error:
          code: VALIDATION_ERROR
          message: The request is invalid
          details:
            - location: params
              field: id
              message: Invalid UUID
    ErrorCode:
      type: string
      enum:
        - VALIDATION_ERROR
        - UNAUTHENTICATED
        - PAYLOAD_TOO_LARGE
        - UNSUPPORTED_MEDIA_TYPE
        - RATE_LIMITED
        - INTERNAL_ERROR
        - SERVICE_UNAVAILABLE
        - NOT_FOUND
        - CONFLICT
        - REFERENCE_NOT_FOUND
        - ORGANIZATION_NOT_VERIFIED
        - EVENT_CANCELLED
        - EVENT_ENDS_BEFORE_START
        - VENUE_OUTSIDE_CITY
        - APPLICATIONS_CLOSED
        - INVALID_SESSION_DAY
        - LISTING_DATE_IN_PAST
        - USERNAME_TAKEN
        - PROFILE_EXISTS
        - PROFILE_INCOMPLETE
        - ALREADY_APPLIED
        - SAFETY_NOTICE_REQUIRED
        - CONTACT_REQUIRED
        - INVALID_SOCIAL_HANDLE
        - INVALID_CREDENTIALS
        - WRONG_PASSWORD
        - INVALID_GOOGLE_TOKEN
        - GOOGLE_ACCOUNT_TAKEN
        - GOOGLE_ALREADY_LINKED
        - INVALID_CODE
        - PHONE_CODES_UNAVAILABLE
        - INVALID_REFRESH_TOKEN
        - UNDERAGE
        - CANNOT_REPORT_SELF
        - CANNOT_RESOLVE_OWN_CASE
        - CANNOT_BAN_ADMIN
        - CANNOT_DECIDE_OWN_REQUEST
        - INVALID_IMAGE
      description: Machine-readable code; clients branch on it, not on the message
    ValidationIssue:
      type: object
      properties:
        location:
          $ref: '#/components/schemas/ValidationLocation'
        field:
          type: string
        message:
          type: string
      required:
        - location
        - field
        - message
      description: One invalid field of the request
    ValidationLocation:
      type: string
      enum:
        - params
        - query
        - body
      description: Part of the request the invalid field is in
    AdminAccountDetails:
      type: object
      properties:
        id:
          type: string
          format: uuid
        role:
          $ref: '#/components/schemas/AccountRole'
        status:
          $ref: '#/components/schemas/AccountStatus'
        signInMethods:
          type: array
          items:
            type: string
            enum:
              - google
              - password
          description: How the account signs in
        age:
          type: integer
          nullable: true
          description: Whole years; null while the account is pending
        createdAt:
          type: string
          format: date-time
          description: When the account was registered
        profile:
          type: object
          nullable: true
          properties:
            username:
              type: string
            displayName:
              type: string
            description:
              type: string
            occupation:
              type: string
            interests:
              type: array
              items:
                $ref: '#/components/schemas/Interest'
            photo:
              $ref: '#/components/schemas/Image'
            cover:
              $ref: '#/components/schemas/CoverImage'
          required:
            - username
            - displayName
            - description
            - occupation
            - interests
            - photo
            - cover
          description: The profile as other users see it; null without a profile
        organization:
          type: object
          nullable: true
          properties:
            name:
              type: string
            description:
              type: string
              nullable: true
            officialLink:
              type: string
              nullable: true
            verificationStatus:
              type: string
              enum:
                - pending
                - verified
                - rejected
                - revoked
              description: >-
                pending: waits for an administrator; only a verified
                organization publishes events
            verifiedAt:
              type: string
              nullable: true
              format: date-time
              description: When an administrator verified it; null otherwise
            logo:
              type: object
              nullable: true
              properties:
                id:
                  type: string
                  format: uuid
                  description: Get the picture with getImage
                width:
                  type: integer
                height:
                  type: integer
              required:
                - id
                - width
                - height
              description: A square shown as a circle; null shows the building icon
              example:
                id: 4f1d2c3b-6a5e-4d7c-9b8a-1e2f3a4b5c6d
                width: 512
                height: 512
          required:
            - name
            - description
            - officialLink
            - verificationStatus
            - verifiedAt
            - logo
          description: Null when the account has not requested organization status
          example:
            name: Мистецький Арсенал
            description: 'Культурний комплекс у центрі Києва: виставки, концерти, лекції.'
            officialLink: https://artarsenal.in.ua
            verificationStatus: pending
            verifiedAt: null
            logo: null
      required:
        - id
        - role
        - status
        - signInMethods
        - age
        - createdAt
        - profile
        - organization
      description: >-
        One account as administrators see it: its profile and its organization
        request
      example:
        id: c3a1f6d2-4b7e-4f0a-9d21-6e8b5a3c7f14
        role: user
        status: active
        signInMethods:
          - google
        age: 25
        createdAt: '2026-10-12T09:30:00.000Z'
        profile:
          username: olena_k
          displayName: Olena
          description: Cinema, galleries and long walks.
          occupation: Student at Kyiv-Mohyla Academy
          interests:
            - id: b1d2c3e4-5f60-4a71-8b82-1a2b3c4d5e01
              name: Книги
              group: Книги й комікси
          photo: null
          cover: null
        organization:
          name: Мистецький Арсенал
          description: 'Культурний комплекс у центрі Києва: виставки, концерти, лекції.'
          officialLink: https://artarsenal.in.ua
          verificationStatus: verified
          verifiedAt: '2026-10-14T12:00:00.000Z'
          logo: null
    Interest:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        group:
          type: string
          description: The heading the interest is shown under
      required:
        - id
        - name
        - group
      description: An interest from the fixed list users pick from
      example:
        id: b1d2c3e4-5f60-4a71-8b82-1a2b3c4d5e01
        name: Книги
        group: Книги й комікси
    Image:
      type: object
      nullable: true
      properties:
        id:
          type: string
          format: uuid
          description: Get the picture with getImage
        width:
          type: integer
        height:
          type: integer
      required:
        - id
        - width
        - height
      description: An uploaded picture, stored cropped
      example:
        id: 4f1d2c3b-6a5e-4d7c-9b8a-1e2f3a4b5c6d
        width: 512
        height: 512
    CoverImage:
      type: object
      nullable: true
      properties:
        id:
          type: string
          format: uuid
          description: Get the picture with getImage
        width:
          type: integer
        height:
          type: integer
        crop:
          type: object
          properties:
            left:
              type: integer
            top:
              type: integer
            width:
              type: integer
            height:
              type: integer
          required:
            - left
            - top
            - width
            - height
          description: >-
            The area the user picked (390:200). A screen of another shape shows
            more of the picture around it, or less
      required:
        - id
        - width
        - height
        - crop
      description: 'The profile cover: the whole picture and the area the user picked'
      example:
        id: 6a7b8c9d-0e1f-4a2b-8c3d-4e5f6a7b8c9d
        width: 2560
        height: 1920
        crop:
          left: 0
          top: 640
          width: 2560
          height: 1313
    BackupHistory:
      type: object
      properties:
        status:
          type: object
          nullable: true
          properties:
            lastSucceededAt:
              type: string
              nullable: true
              format: date-time
              description: When the last nightly backup succeeded; null if none has
            overdue:
              type: boolean
              description: The last nightly backup failed, or it is more than 26 hours old
          required:
            - lastSucceededAt
            - overdue
          description: Null where no nightly backup has run, e.g. in development
        items:
          type: array
          items:
            $ref: '#/components/schemas/BackupRun'
          description: The last 30 nights, newest first
      required:
        - status
        - items
      example:
        status:
          lastSucceededAt: '2026-11-06T01:00:12.000Z'
          overdue: true
        items:
          - finishedAt: '2026-11-07T01:20:31.000Z'
            succeeded: false
            attempts: 3
            durationSeconds: 0
            sizeBytes: null
            reason: unreachable
          - finishedAt: '2026-11-06T01:00:12.000Z'
            succeeded: true
            attempts: 1
            durationSeconds: 12
            sizeBytes: 4404019
            reason: null
    BackupRun:
      type: object
      properties:
        finishedAt:
          type: string
          format: date-time
          description: 'When the night ended: the copy was kept, or the last attempt failed'
        succeeded:
          type: boolean
        attempts:
          type: integer
          description: Attempts that night, at most 3
        durationSeconds:
          type: integer
          description: How long the last attempt took
        sizeBytes:
          type: integer
          nullable: true
          description: Size of the copy; null when the night failed
        reason:
          type: string
          nullable: true
          enum:
            - unreachable
            - auth_failed
            - timeout
            - locked
            - unreadable
            - failed
            - null
          description: >-
            Why the night failed; null when it succeeded. `unreachable`: the
            database did not answer. `auth_failed`: it refused the sign-in.
            `timeout`: the copy took more than 15 minutes. `locked`: tables
            stayed locked, e.g. by a migration. `unreadable`: the copy could not
            be read back. `failed`: anything else. The details are only in the
            server log
      required:
        - finishedAt
        - succeeded
        - attempts
        - durationSeconds
        - sizeBytes
        - reason
    PlatformStats:
      type: object
      properties:
        users:
          type: integer
          description: 'Active accounts: registered and not banned'
        events:
          type: integer
          description: Published events that have not ended yet
        matches:
          type: integer
          description: Matches proposed so far
        openReports:
          type: integer
          description: Open report cases
        backup:
          type: object
          nullable: true
          properties:
            lastSucceededAt:
              type: string
              nullable: true
              format: date-time
              description: When the last nightly backup succeeded; null if none has
            overdue:
              type: boolean
              description: The last nightly backup failed, or it is more than 26 hours old
          required:
            - lastSucceededAt
            - overdue
          description: >-
            Nightly database backups; null where none has run, e.g. in
            development
      required:
        - users
        - events
        - matches
        - openReports
        - backup
      example:
        users: 128
        events: 42
        matches: 0
        openReports: 3
        backup:
          lastSucceededAt: '2026-11-07T01:00:42.000Z'
          overdue: false
    AdminCategoryList:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/AdminCategory'
      required:
        - items
      example:
        items:
          - id: 2d8b4f6c-0e3a-4c5d-9f7b-9a4c6e8d0f03
            name: Концерти
            slug: concerts
            isActive: true
    AdminCategory:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        slug:
          type: string
          description: >-
            Made from the name when the category is added and never changed,
            also on a rename; the event import maps providers' genres to it
        isActive:
          type: boolean
          description: Inactive categories are hidden from filters and cannot be picked
      required:
        - id
        - name
        - slug
        - isActive
      description: A category as administrators see it
      example:
        id: 2d8b4f6c-0e3a-4c5d-9f7b-9a4c6e8d0f03
        name: Концерти
        slug: concerts
        isActive: true
    CreateCategoryBody:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 60
          description: >-
            Saved with runs of spaces as one and every apostrophe (' ’ ʼ) as ʼ;
            unique regardless of case, spaces and apostrophe
        isActive:
          type: boolean
          default: true
          description: Whether users can pick the category
      required:
        - name
      additionalProperties: false
      example:
        name: Майстер-класи
    UpdateCategoryBody:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 60
          description: >-
            Saved with runs of spaces as one and every apostrophe (' ’ ʼ) as ʼ;
            unique regardless of case, spaces and apostrophe
        isActive:
          type: boolean
          description: Whether users can pick the category
      additionalProperties: false
      description: Only the fields to change
      example:
        isActive: false
    AdminEventsPage:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/AdminEvent'
        page:
          $ref: '#/components/schemas/PageInfo'
      required:
        - items
        - page
      example:
        items:
          - id: 3f1c2a9e-8b4d-4e2a-9c71-5d0e6b7a8f10
            title: 'Open-air film night: Shadows of Forgotten Ancestors'
            description: Screening in the park, bring a blanket.
            category:
              id: 2d8b4f6c-0e3a-4c5d-9f7b-9a4c6e8d0f03
              name: Концерти
            venue:
              id: 5a1c3e5f-7b9d-4f1a-8c3e-5f7a9b1d3e05
              name: Natalka Park lawn
              address: Naberezhno-Luhova St, Kyiv
              location:
                lat: 50.4825
                lng: 30.5181
            startsAt: '2026-10-17T19:00:00+03:00'
            startTimeKnown: true
            endsAt: '2026-10-17T21:30:00+03:00'
            endTimeKnown: true
            priceMin: 150
            priceMax: null
            imageUrl: null
            photo: null
            sourceUrl: null
            source: organization
            status: published
            organization:
              accountId: e1f3a5c7-9b2d-4f6e-8a0c-3d5f7b9e1a2c
              name: Podil Film Club
        page:
          limit: 20
          offset: 0
          hasMore: false
    AdminEvent:
      type: object
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        description:
          type: string
        category:
          $ref: '#/components/schemas/Category'
        venue:
          $ref: '#/components/schemas/Venue'
        startsAt:
          type: string
          format: date-time
        startTimeKnown:
          type: boolean
          description: >-
            False when the provider gives no time of day: startsAt is then a
            default opening time (12:00 Europe/Kyiv for exhibitions) that only
            orders the event and its sessions; show the dates without a time.
            Always true for an organization event
        endsAt:
          type: string
          format: date-time
        endTimeKnown:
          type: boolean
          description: >-
            False for an imported event whose provider gives no end: endsAt is
            then the end of its start day in Europe/Kyiv and only startsAt
            should be shown. Always true for an organization event
        priceMin:
          type: integer
          nullable: true
          minimum: 0
          description: >-
            The lowest ticket price in whole hryvnias. Null when the price is
            unknown: show no price. 0 with priceMax null or 0: the event is free
        priceMax:
          type: integer
          nullable: true
          minimum: 0
          description: >-
            The highest ticket price in whole hryvnias, when the tickets cost
            from priceMin to priceMax; never below priceMin. Null for one price,
            a free event or an unknown price
        imageUrl:
          type: string
          nullable: true
          description: >-
            Imported events: the provider's image URL, shown as is; null for
            organization events
        photo:
          type: object
          nullable: true
          properties:
            id:
              type: string
              format: uuid
              description: Get the picture with getImage; a guest token may
            width:
              type: integer
            height:
              type: integer
            crop:
              type: object
              properties:
                left:
                  type: integer
                top:
                  type: integer
                width:
                  type: integer
                height:
                  type: integer
              required:
                - left
                - top
                - width
                - height
              description: >-
                The area the organization picked (2:1, the catalog card). The
                event page, almost square, shows more around it
          required:
            - id
            - width
            - height
            - crop
          description: >-
            The cover an organization uploaded; null for imported events and
            without one
          example:
            id: 7b8c9d0e-1f2a-4b3c-9d4e-5f6a7b8c9d0e
            width: 2560
            height: 1707
            crop:
              left: 0
              top: 213
              width: 2560
              height: 1280
        sourceUrl:
          type: string
          nullable: true
          description: >-
            Imported events: the event's page at the provider, to credit it and
            to buy tickets; null otherwise
        source:
          $ref: '#/components/schemas/EventSource'
        status:
          $ref: '#/components/schemas/EventStatus'
        organization:
          type: object
          nullable: true
          properties:
            accountId:
              type: string
              format: uuid
              description: Get it with adminGetOrganization
            name:
              type: string
          required:
            - accountId
            - name
          description: The organization that added it; null for an imported one
      required:
        - id
        - title
        - description
        - category
        - venue
        - startsAt
        - startTimeKnown
        - endsAt
        - endTimeKnown
        - priceMin
        - priceMax
        - imageUrl
        - photo
        - sourceUrl
        - source
        - status
        - organization
      description: >-
        An event as administrators see it: in any status, past or upcoming, with
        who added it
      example:
        id: 3f1c2a9e-8b4d-4e2a-9c71-5d0e6b7a8f10
        title: 'Open-air film night: Shadows of Forgotten Ancestors'
        description: Screening in the park, bring a blanket.
        category:
          id: 2d8b4f6c-0e3a-4c5d-9f7b-9a4c6e8d0f03
          name: Концерти
        venue:
          id: 5a1c3e5f-7b9d-4f1a-8c3e-5f7a9b1d3e05
          name: Natalka Park lawn
          address: Naberezhno-Luhova St, Kyiv
          location:
            lat: 50.4825
            lng: 30.5181
        startsAt: '2026-10-17T19:00:00+03:00'
        startTimeKnown: true
        endsAt: '2026-10-17T21:30:00+03:00'
        endTimeKnown: true
        priceMin: 150
        priceMax: null
        imageUrl: null
        photo: null
        sourceUrl: null
        source: organization
        status: published
        organization:
          accountId: e1f3a5c7-9b2d-4f6e-8a0c-3d5f7b9e1a2c
          name: Podil Film Club
    Category:
      type: object
      properties:
        id:
