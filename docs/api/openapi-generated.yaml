      operationId: acceptMatch
      summary: Accept a proposed match
      description: >-
        Accept the proposal. Once the other user accepts too, the match is
        `mutual` and both see the contacts. Accepting again changes nothing.
        Needs a signed-in account; a guest token gets 401.
