          required: false
          description: Left edge, a fraction of the picture’s width (0 to 1)
          name: cropLeft
          in: query
        - schema:
            type: number
            nullable: true
            minimum: 0
            maximum: 1
            description: Top edge, a fraction of the picture’s height (0 to 1)
          required: false
          description: Top edge, a fraction of the picture’s height (0 to 1)
          name: cropTop
