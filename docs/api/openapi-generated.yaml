            description: Width, a fraction of the picture’s width
          required: true
          description: Width, a fraction of the picture’s width
          name: cropWidth
          in: query
        - schema:
            type: number
            minimum: 0
            maximum: 1
            exclusiveMinimum: true
            description: Height, a fraction of the picture’s height
          required: true
          description: Height, a fraction of the picture’s height
          name: cropHeight
          in: query
      requestBody:
        required: true
        content:
          image/jpeg:
            schema:
              type: string
              format: binary
          image/png:
