  /api/v1/events/{id}/applications:
    post:
      operationId: applyToEvent
      summary: Ask for a match at an event
      description: >-
        Join the matching pool of the event with the answers to the matching
        questions. A single-day event has one session; for an event that runs on
        several days, `dates` lists the days the user can go, and a match lists
        the days both users share. The answer says when the next matching round
        runs, or that a match is proposed at once. Needs a signed-in account; a
        guest token gets 401.
      tags:
        - Matching
      security:
        - bearerAuth: []
      parameters:
        - schema:
            type: string
            format: uuid
            description: Event id
          required: true
          description: Event id
          name: id
          in: path
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateApplicationBody'
      responses:
        '201':
          description: The application, waiting in the pool
          headers:
            Location:
              description: URL of the created object
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Application'
        '400':
          description: The request is invalid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: No access token, or an invalid or expired one
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: No event with this id
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: '`ALREADY_APPLIED`: the caller is already in the pool of this event.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: >-
            `PROFILE_INCOMPLETE`: the profile lacks a communication format, an
            interest or a linked account; the app sends the user to complete it.
            `EVENT_CANCELLED`: the event is cancelled. `APPLICATIONS_CLOSED`:
            the cutoff of a picked day has passed: an hour before it starts, or
            for a session of 3 hours or more, 2 hours before it ends.
            `INVALID_SESSION_DAY`: the event does not run on one of `dates`, one
            of them is after the catalog window (today and the next 28 days), or
            the event runs on several days and `dates` is missing.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
