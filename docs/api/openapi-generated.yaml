        '400':
          description: The request is invalid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: No access token, or an invalid or expired one
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: >-
            `REFERENCE_NOT_FOUND`: no user has this username, or no active
            listing has this id. `CANNOT_REPORT_SELF`: it is your own username
            or your own listing.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
