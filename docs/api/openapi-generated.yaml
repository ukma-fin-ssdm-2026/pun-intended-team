  /api/v1/admin/report-cases/{id}/ban:
    post:
      operationId: adminBanReportedUser
      summary: Ban the reported user
      description: >-
        Ban the user the case is about and resolve the case. Every session of
        the user ends at once: their next request gets 401, and they cannot sign
        in again. On a case already resolved as banned, the ban is applied
        again, so a ban that failed halfway can be retried. Needs an
        administrator account; other accounts get 404.
      tags:
        - Moderation
      security:
        - bearerAuth: []
      parameters:
        - schema:
            type: string
            format: uuid
            description: Report case id
          required: true
          description: Report case id
          name: id
          in: path
      responses:
        '200':
          description: The resolved case
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReportCaseDetails'
        '400':
          description: The request is invalid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: No access token, or an invalid or expired one
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: No report case with this id, or the caller is not an administrator
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: >-
            `CONFLICT`: the case was dismissed, or it is about a listing.
            `CANNOT_BAN_ADMIN`: the reported user is an administrator.
            `CANNOT_RESOLVE_OWN_CASE`: the case is about the caller or their
            listing, which another administrator must judge
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/admin/report-cases/{id}/remove-listing:
    post:
      operationId: adminRemoveReportedListing
      summary: Remove the reported listing
      description: >-
        Remove the listing a listing case is about and resolve the case as
        `removed`. The listing leaves the feed and its page answers 404, as
        after the author deletes it. On a case already resolved as removed, the
        removal is applied again, so a removal that failed halfway can be
        retried. Needs an administrator account; other accounts get 404.
      tags:
        - Moderation
      security:
        - bearerAuth: []
      parameters:
        - schema:
            type: string
            format: uuid
            description: Report case id
          required: true
          description: Report case id
          name: id
          in: path
      responses:
        '200':
          description: The resolved case
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReportCaseDetails'
        '400':
          description: The request is invalid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: No access token, or an invalid or expired one
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: No report case with this id, or the caller is not an administrator
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: >-
            `CONFLICT`: the case was banned or dismissed, or it is about a user.
            `CANNOT_RESOLVE_OWN_CASE`: the case is about the caller or their
            listing, which another administrator must judge
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/admin/report-cases/{id}/dismiss:
    post:
      operationId: adminDismissReportCase
      summary: Dismiss a report case
      description: >-
        Resolve the case without action, when the reports turn out to be
        unfounded. Needs an administrator account; other accounts get 404.
      tags:
        - Moderation
      security:
        - bearerAuth: []
      parameters:
        - schema:
            type: string
            format: uuid
            description: Report case id
          required: true
          description: Report case id
          name: id
          in: path
      responses:
        '200':
          description: The resolved case
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReportCaseDetails'
        '400':
          description: The request is invalid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: No access token, or an invalid or expired one
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: No report case with this id, or the caller is not an administrator
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: >-
            `CONFLICT`: the case is already resolved. `CANNOT_RESOLVE_OWN_CASE`:
            the case is about the caller or their listing, which another
            administrator must judge
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/reports:
    post:
      operationId: createReport
      summary: Report a user or a listing
      description: >-
        Report a user by username, or someone else’s listing by its id, with a
        reason and an optional comment. Administrators review it; repeated
        reports on one user or one listing are grouped into one case. The
        reporter gets no details about the case, and a report on a banned user
        is accepted the same way but not stored. Needs a signed-in account; a
        guest token gets 401.
      tags:
        - Moderation
      security:
        - bearerAuth: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateReportBody'
      responses:
        '204':
          description: The report was received
        '400':
          description: The request is invalid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: No access token, or an invalid or expired one
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: >-
            `REFERENCE_NOT_FOUND`: no user has this username, or no active
            listing has this id. `CANNOT_REPORT_SELF`: it is your own username
            or your own listing.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
