    ReplaceLinkedAccountsBody:
      type: object
      properties:
        linkedAccounts:
          type: array
          items:
            type: object
            properties:
              network:
                $ref: '#/components/schemas/SocialNetwork'
              username:
                type: string
                maxLength: 200
                description: >-
                  A nickname with or without "@", or a profile link; for
                  WhatsApp, a phone number. Kept as the bare handle; one that
                  does not fit is INVALID_SOCIAL_HANDLE
            required:
              - network
              - username
            additionalProperties: false
          maxItems: 5
          description: >-
            The whole set, at most one per social network; an empty list is
            CONTACT_REQUIRED, since a mutual match needs a contact
      required:
        - linkedAccounts
      additionalProperties: false
      example:
        linkedAccounts:
          - network: telegram
            username: '@olena_k'
    HealthResponse:
      type: object
      properties:
        status:
          type: string
          enum:
            - healthy
            - unhealthy
          description: healthy only while every dependency in checks is up
        checks:
          type: object
          properties:
            database:
              type: string
              enum:
                - up
                - down
          required:
            - database
          description: >-
            Each dependency the API needs, up or down; the cause of a failure is
            only logged
      required:
        - status
        - checks
      description: Whether the API and the dependencies it needs are up
      example:
        status: healthy
        checks:
          database: up
  parameters: {}
paths:
  /api/v1/admin/backups:
    get:
      operationId: adminListBackups
      summary: List the nightly database backups
      description: >-
        Tell whether the nightly database backups are up to date and list the
        last 30 nights. A failed night carries a reason code only; hosts, users
        and error messages stay in the server log. Needs an administrator
        account; other accounts get 404.
      tags:
        - Admin
      security:
        - bearerAuth: []
      responses:
        '200':
          description: The status and the last nights
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BackupHistory'
        '401':
          description: No access token, or an invalid or expired one
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Not found, or the caller is not an administrator
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/admin/stats:
    get:
      operationId: adminGetStats
      summary: Get platform statistics
      description: >-
        Count active users, upcoming events, matches and open report cases, and
        tell whether the nightly database backups are up to date. Needs an
        administrator account; other accounts get 404.
      tags:
        - Admin
      security:
        - bearerAuth: []
      responses:
        '200':
          description: The current counts
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlatformStats'
        '401':
          description: No access token, or an invalid or expired one
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Not found, or the caller is not an administrator
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/admin/categories:
    get:
      operationId: adminListCategories
      summary: List all categories
      description: >-
        List all categories, including inactive ones, to manage the directory.
        To pick a category for an event or listing, use listCategories. Needs an
        administrator account; other accounts get 404.
      tags:
        - Categories
      security:
        - bearerAuth: []
      responses:
        '200':
          description: All categories, active or not
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminCategoryList'
        '401':
          description: No access token, or an invalid or expired one
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Not found, or the caller is not an administrator
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    post:
      operationId: adminCreateCategory
      summary: Add a category
      description: >-
        Add a category. The server makes its slug from the name, transliterated
        to Latin (Майстер-класи → maister-klasy), with a number added if another
        category has it (maister-klasy-2). Needs an administrator account; other
        accounts get 404.
      tags:
        - Categories
      security:
        - bearerAuth: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCategoryBody'
      responses:
        '201':
          description: The new category
          headers:
            Location:
              description: URL of the created object
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminCategory'
        '400':
          description: The request is invalid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
