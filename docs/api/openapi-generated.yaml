      summary: List your notifications
      description: >-
        The caller’s inbox, newest first, read and unread alike. Needs a
        signed-in account; a guest token gets 401.
      tags:
        - Notifications
      security:
        - bearerAuth: []
      parameters:
        - schema:
            type: integer
            minimum: 1
            maximum: 20
            default: 20
            description: Items per page, at most 20
          required: false
          description: Items per page, at most 20
          name: limit
          in: query
        - schema:
            type: integer
            nullable: true
            minimum: 0
            default: 0
            description: Items to skip
          required: false
          description: Items to skip
          name: offset
          in: query
      responses:
        '200':
          description: A page of notifications
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationsPage'
        '400':
          description: The request is invalid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: No access token, or an invalid or expired one
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/notifications/{id}/read:
    post:
      operationId: readNotification
      summary: Mark a notification read
      description: >-
        Mark one of the caller’s notifications read. Marking it again changes
        nothing and keeps `readAt`. Needs a signed-in account; a guest token
        gets 401.
      tags:
        - Notifications
      security:
        - bearerAuth: []
      parameters:
        - schema:
            type: string
            format: uuid
            description: Notification id
          required: true
          description: Notification id
          name: id
          in: path
      responses:
        '200':
          description: The notification, read
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Notification'
        '400':
          description: The request is invalid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: No access token, or an invalid or expired one
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: No notification with this id in the caller’s inbox
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/me/push-token:
    put:
      operationId: registerPushToken
      summary: Register this device for push
      description: >-
        Register the Expo push token of the device this session runs on. One
        token per session: a new one replaces the last, and a token registered
        before by another account or session moves to this one. The token is
        removed when the session ends (sign-out, a ban, a refresh with a stolen
        token). Needs a signed-in account; a guest token gets 401.
      tags:
        - Notifications
      security:
        - bearerAuth: []
      x-mcp: false
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterPushTokenBody'
      responses:
        '204':
          description: The device gets the caller’s pushes
        '400':
          description: The request is invalid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: No access token, or an invalid or expired one
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    delete:
      operationId: removePushToken
      summary: Stop push on this device
      description: >-
        Remove the push token of this session, e.g. when the user turns push
        off. Removing it again, or when none was registered, also answers 204.
        Needs a signed-in account; a guest token gets 401.
      tags:
        - Notifications
      security:
        - bearerAuth: []
      x-mcp: false
      responses:
        '204':
          description: The device gets no more pushes
        '401':
          description: No access token, or an invalid or expired one
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/interests:
    get:
      operationId: listInterests
      summary: List the interests users can pick
      description: >-
        List the fixed set of interests users can pick for their profile, group
        by group and then by name; their ids go in interestIds. Needs a
        signed-in account; a guest token gets 401.
      tags:
        - Interests
      security:
        - bearerAuth: []
      responses:
        '200':
          description: All interests
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InterestList'
        '401':
          description: No access token, or an invalid or expired one
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/me/profile:
    get:
      operationId: getMyProfile
      summary: Get your profile
      description: >-
        Get the caller’s own profile with the age computed from the account’s
        date of birth. `isComplete` is true once a communication format, at
        least one interest and at least one linked account are set. Needs a
        signed-in account; a guest token gets 401.
      tags:
        - Profiles
      security:
        - bearerAuth: []
      responses:
        '200':
          description: The profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Profile'
        '401':
          description: No access token, or an invalid or expired one
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: The account has not created a profile yet
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    post:
      operationId: createMyProfile
      summary: Start your profile
      description: >-
        First onboarding step: create the caller’s profile with a username and a
        display name. Every later step is `updateMyProfile` and
        `replaceMyInterests`. Needs a signed-in account; a guest token gets 401.
      tags:
        - Profiles
      security:
        - bearerAuth: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateProfileBody'
      responses:
        '201':
          description: The new profile
          headers:
            Location:
              description: URL of the created object
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Profile'
        '400':
          description: The request is invalid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: No access token, or an invalid or expired one
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: >-
            `USERNAME_TAKEN`: another user has this username. `PROFILE_EXISTS`:
            the account already has a profile.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    patch:
      operationId: updateMyProfile
      summary: Edit your profile
      description: >-
        Change the caller’s profile: any of displayName, username, description,
        occupation, communicationFormat and sharePhone; only the fields sent
        change. Used for every later onboarding step and for the edit screen.
        Needs a signed-in account; a guest token gets 401.
      tags:
        - Profiles
      security:
        - bearerAuth: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateProfileBody'
      responses:
        '200':
          description: The updated profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Profile'
        '400':
          description: The request is invalid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: No access token, or an invalid or expired one
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: The account has not created a profile yet
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: '`USERNAME_TAKEN`: another user has this username.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/me/profile/interests:
    put:
      operationId: replaceMyInterests
      summary: Set your interests
      description: >-
        Replace the whole set of the caller’s interests with the given ids; an
        empty list clears it. Needs a signed-in account; a guest token gets 401.
      tags:
        - Profiles
      security:
        - bearerAuth: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReplaceInterestsBody'
      responses:
        '200':
          description: The updated profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Profile'
        '400':
          description: The request is invalid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: No access token, or an invalid or expired one
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: The account has not created a profile yet
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: '`REFERENCE_NOT_FOUND`: one of the interest ids does not exist.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/me/profile/linked-accounts:
    put:
      operationId: replaceMyLinkedAccounts
      summary: Set your networks
      description: >-
        Replace the whole set of networks (Telegram, Instagram, …) a mutual
        match sees, at most one per app. At least one is required, since sign-in
        is Google-only and there is no phone number to share. Needs a signed-in
        account; a guest token gets 401.
      tags:
        - Profiles
      security:
        - bearerAuth: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReplaceLinkedAccountsBody'
      responses:
        '200':
          description: The updated profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Profile'
        '400':
          description: The request is invalid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: No access token, or an invalid or expired one
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: The account has not created a profile yet
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: >-
            `CONTACT_REQUIRED`: the list is empty. `INVALID_SOCIAL_HANDLE`: a
            username does not fit its social network; `details` names it.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/me/profile/safety-notice:
    post:
      operationId: acknowledgeSafetyNotice
      summary: Acknowledge the safety notice
      description: >-
        Record that the caller read the safety notice the app shows on a mutual
        match (FR-032): `safetyNotice` becomes `acknowledged`, or `hidden` with
        `dontShowAgain`. Until the first acknowledgment, `getMatchContacts`
        holds the contacts back. Needs a signed-in account; a guest token gets
        401.
      tags:
        - Profiles
      security:
        - bearerAuth: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AcknowledgeSafetyNoticeBody'
      responses:
        '200':
          description: The profile with the new `safetyNotice`
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Profile'
        '400':
          description: The request is invalid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: No access token, or an invalid or expired one
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: The account has not created a profile yet
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/me/profile/photo:
    put:
      operationId: uploadMyPhoto
      summary: Upload your photo
      description: >-
        Set or replace the caller’s avatar: a square, shown as a circle, stored
        at up to 512 × 512. Send the picture itself as the body, with its
        Content-Type (JPEG, PNG or WebP, up to 10 MB), and the area picked in
        the crop preview as fractions in the query. The server cuts the largest
        area of the exact shape inside it, rotates the picture by its EXIF
        orientation, drops its metadata (location included) and stores it as
        WebP. Needs a signed-in account; a guest token gets 401.
      tags:
        - Profiles
      security:
        - bearerAuth: []
      x-mcp: false
      parameters:
        - schema:
            type: number
            nullable: true
            minimum: 0
            maximum: 1
            description: Left edge, a fraction of the picture’s width (0 to 1)
          required: false
          description: Left edge, a fraction of the picture’s width (0 to 1)
          name: cropLeft
          in: query
        - schema:
            type: number
            nullable: true
            minimum: 0
            maximum: 1
            description: Top edge, a fraction of the picture’s height (0 to 1)
          required: false
          description: Top edge, a fraction of the picture’s height (0 to 1)
          name: cropTop
          in: query
        - schema:
            type: number
            minimum: 0
            maximum: 1
            exclusiveMinimum: true
            description: Width, a fraction of the picture’s width
          required: true
          description: Width, a fraction of the picture’s width
          name: cropWidth
          in: query
        - schema:
            type: number
            minimum: 0
            maximum: 1
            exclusiveMinimum: true
            description: Height, a fraction of the picture’s height
          required: true
          description: Height, a fraction of the picture’s height
          name: cropHeight
          in: query
      requestBody:
        required: true
        content:
          image/jpeg:
            schema:
              type: string
              format: binary
          image/png:
            schema:
              type: string
              format: binary
          image/webp:
            schema:
              type: string
              format: binary
      responses:
        '200':
          description: The updated profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Profile'
        '400':
          description: The request is invalid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: No access token, or an invalid or expired one
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: The account has not created a profile yet
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '413':
          description: The file is larger than the limit
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '415':
          description: The Content-Type is not one of the accepted file types
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: >-
            `INVALID_IMAGE`: the file is not a JPEG, PNG or WebP picture, is
            broken, or has over 60 megapixels.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    delete:
      operationId: deleteMyPhoto
      summary: Delete your photo
      description: >-
        Remove the caller’s avatar; the initial is shown instead. Without a
        photo, nothing changes. Needs a signed-in account; a guest token gets
        401.
      tags:
        - Profiles
      security:
        - bearerAuth: []
      responses:
        '200':
          description: The updated profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Profile'
        '401':
          description: No access token, or an invalid or expired one
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: The account has not created a profile yet
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
