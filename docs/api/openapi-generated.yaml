          description: >-
            `CONTACT_REQUIRED`: the list is empty. `INVALID_SOCIAL_HANDLE`: a
            username does not fit its social network; `details` names it.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /health:
    get:
      operationId: getHealth
      summary: Check that the API and its database are up
      description: >-
        Checks that the API is running and that its database answers within 2 s.
        `200` while it is healthy; `503` with the dependency that is down in
        `checks`. No access token needed.
      tags:
        - System
      responses:
        '200':
          description: The API and its database are up
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
        '503':
          description: A dependency the API needs is down
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
