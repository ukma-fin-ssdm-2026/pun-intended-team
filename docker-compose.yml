# AI Usage Note
# Generated by Claude (Claude Code): this file.
# How it was verified: docker compose up -d, the db service reached healthy.
# Reviewed by: Vlad-Re
#
# Local PostgreSQL. Credentials come from .env, see .env.example.
# Start with `docker compose up -d`, stop with `docker compose down` (add `-v` to delete the data).
services:
  db:
    image: postgres:18
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env}
    ports:
      # localhost 
      - '127.0.0.1:${POSTGRES_PORT:-5432}:5432'
    volumes:
      # PostgreSQL 18 images keep the data in a versioned folder under /var/lib/postgresql, not in .../data.
      - db-data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  db-data:
