# AI Usage Note
# Generated by Claude (Claude Code): this config.
# How it was verified: pre-commit run --all-files, plus a fake token and a badly formatted file in a trial commit.
# Reviewed by: Vlad-Re
#
# Run by .githooks/pre-commit on every commit. Setup is in the README.
repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks

  # Same file types as the `format` and `lint` scripts in package.json.
  - repo: local
    hooks:
      - id: prettier
        name: prettier
        entry: npx prettier --write --ignore-unknown
        language: system
        files: \.(ts|mjs)$
      
      - id: eslint
        name: eslint
        entry: npx eslint --no-warn-ignored
        language: system
        files: \.(ts|mjs)$
