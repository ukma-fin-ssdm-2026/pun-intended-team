# AI Usage Note
# Generated by Claude (Claude Code): this workflow.
# How it was verified: actionlint; the comparison script run on hand-made JUnit reports; the loop run locally for
# 2 repeats against a throwaway postgres:18 container.
# Reviewed by: pending
#
# Lab 10 bonus: a hunt for flaky tests. Runs the full test suite several times on the same commit and lists every
# test whose result differed between the repeats. Manual only: each repeat costs billed Actions minutes.
# Before each repeat the database is recreated as the "E2E tests" job of ci.yml starts it: an empty cluster with
# only the nearby database, then the migrations and the role passwords, so no repeat sees the rows of the last one.
# The job is green only when every test passed in every repeat; a flaky test or one that failed in every repeat
# (reported apart, as "always failing") makes it red.
name: Flaky tests

on:
  workflow_dispatch:
    inputs:
      repeats:
        description: How many times to run the full test suite (at least 5)
        required: true
        type: number
        default: 5

permissions: {}

jobs:
  flaky-tests:
    name: Flaky tests
    runs-on: ubuntu-latest # TEMPORARY: was [self-hosted, linux]
    # A repeat took 1.5 min locally (database setup included); "E2E tests" takes 2.5–3 min with the install and the
    # coverage. With about 2 min a repeat and 2 min of setup, 5 repeats take about 12 min; 30 min leaves room for
    # slower runners or about 12 repeats.
    timeout-minutes: 30
    permissions:
      contents: read
    # Same service as "E2E tests" in ci.yml. Throwaway database, so the password is not a secret.
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: nearby
          POSTGRES_PASSWORD: nearby_dev_password
          POSTGRES_DB: nearby
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nearby -d nearby"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - name: Check the number of repeats
        env:
          REPEATS: ${{ inputs.repeats }}
        run: |
          if ! [[ "$REPEATS" =~ ^[0-9]+$ ]] || (( REPEATS < 5 )); then
            echo "::error::repeats must be a whole number of at least 5, got '$REPEATS'"
            exit 1
          fi

      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      # As in "E2E tests": @prisma/engines also provides the schema engine for the migrations.
      - name: Install dependencies
        run: |
          npm ci --ignore-scripts
          npm rebuild @prisma/engines
          npx --no-install prisma generate

      - name: Build
        run: npm run build

      # Each repeat: recreate the database, apply the migrations, set the role passwords, run all tests without
      # coverage. A failing repeat does not stop the loop; a failing database setup does, as it is not a test result.
      - name: Run the full test suite repeatedly
        env:
          REPEATS: ${{ inputs.repeats }}
          POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
          DATABASE_URL: postgresql://nearby:nearby_dev_password@localhost:5432/nearby
          MAIN_DATABASE_URL: postgresql://nearby_main:nearby_main_dev_password@localhost:5432/nearby
          IMPORT_DATABASE_URL: postgresql://nearby_import:nearby_import_dev_password@localhost:5432/nearby
          BACKUP_DATABASE_URL: postgresql://nearby_backup:nearby_backup_dev_password@localhost:5432/nearby
        run: |
          mkdir -p flaky-tests-out
          for i in $(seq 1 "$REPEATS"); do
            echo "::group::Repeat $i of $REPEATS"
            started=$SECONDS
            # Drops every database and role the service did not start with; the migrations create the roles again.
            docker exec -i "$POSTGRES_CONTAINER" psql -q -v ON_ERROR_STOP=1 -U nearby -d postgres <<'SQL'
          SELECT format('DROP DATABASE %I WITH (FORCE)', datname) FROM pg_database
            WHERE datname NOT IN ('postgres', 'template0', 'template1') \gexec
          SELECT format('DROP ROLE %I', rolname) FROM pg_roles
            WHERE rolname !~ '^pg_' AND rolname <> current_user \gexec
          CREATE DATABASE nearby;
          SQL
            npx --no-install prisma migrate deploy
            npm run db:set-passwords
            code=0
            node --test \
              --test-reporter=spec --test-reporter-destination=stdout \
              --test-reporter=junit --test-reporter-destination="flaky-tests-out/repeat-$i.xml" \
              "tests/**/*.test.ts" || code=$?
            echo "$code" > "flaky-tests-out/repeat-$i.exit"
            echo "::endgroup::"
            echo "Repeat $i of $REPEATS: exit code $code, $((SECONDS - started)) s"
          done

      - name: Compare the repeats
        if: ${{ !cancelled() }}
        env:
          REPEATS: ${{ inputs.repeats }}
        run: node scripts/flaky-tests/compare.mjs --dir flaky-tests-out --repeats "$REPEATS"

      - name: Upload the JUnit reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: flaky-tests-junit
          path: flaky-tests-out/
          retention-days: 7
          if-no-files-found: warn
