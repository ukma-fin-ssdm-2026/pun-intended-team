# AI Usage Note
# Generated by Claude (Claude Code): this workflow.
# How it was verified: every command of the job run locally in app/ with Node 26; YAML parsed and checked with actionlint.
# The workflow itself runs only on GitHub.
# Reviewed by:
name: Client checks

on:
  workflow_call:
  workflow_dispatch:

permissions: {}

jobs:
  client-checks:
    name: Client checks
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v7

      # The client's tools accept Node 20.19+, 22.13+, 24.3+ and 25+, so the API's Node 26 works for both.
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: app/package-lock.json

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npm run typecheck

      - name: Check formatting
        run: npx prettier --check .

      # The client's API types are generated from the spec; a spec change without them breaks this step.
      - name: Check API types match the spec
        run: |
          npm run api:types
          if ! git diff --exit-code src/api/schema.d.ts; then
            echo "::error file=app/src/api/schema.d.ts::The API types are out of date. Run 'npm run api:types' in app/ and commit src/api/schema.d.ts."
            exit 1
          fi
