# AI Usage Note
# Generated by Claude (claude.ai): this workflow, replacing the echo-only stub.
# How it was verified: actionlint (syntax, expressions, reusable-workflow inputs and permissions).
# The calls themselves run only on GitHub.
# Reviewed by: Vlad-Re
# Changed by Claude (Claude Code): added the code-quality job.
#
# CI = everything that must be green for the code to count as healthy.
# Each check lives in its own reusable workflow; this file only decides what belongs to CI.
# The README badge points here, and the "CI passed" job is the single required check in the rulesets,
# so adding a new check means adding one call below and to `needs:`, without touching the rulesets.
name: CI

on:
  push:
    branches: [main, staging]
  pull_request:
  workflow_dispatch:

permissions: {}

jobs:
  api-tests:
    uses: ./.github/workflows/api-tests.yml
    permissions:
      contents: read

  docs:
    uses: ./.github/workflows/api-docs.yml
    permissions:
      contents: read

  dependency-audit:
    uses: ./.github/workflows/dependency-audit.yml
    permissions:
      contents: read

  code-quality:
    uses: ./.github/workflows/code-quality.yml
    permissions:
      contents: read

  # Gate job: green only when every job above succeeded.
  # `always()` makes it run (and fail) even when a needed job failed or was cancelled;
  # without it the job would be skipped, and a skipped required check counts as passing.
  ci-passed:
    name: CI passed
    if: always()
    needs: [api-tests, docs, dependency-audit, code-quality]
    runs-on: ubuntu-latest
    steps:
      - name: Check that every CI job succeeded
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Job results: $RESULTS"
          for result in $RESULTS; do
            if [ "$result" != success ]; then
              echo "::error::At least one CI job did not succeed ($result). See the jobs above."
              exit 1
            fi
          done
