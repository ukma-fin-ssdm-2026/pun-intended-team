name: Deploy staging

on:
  workflow_call:
    inputs:
      version:
        description: Full SHA of the commit whose image to deploy
        required: true
        type: string
  workflow_dispatch:
    inputs:
      version:
        description: Full SHA of the commit whose image to deploy; empty for the latest staging
        required: false
        type: string

permissions: {}

jobs:
  deploy:
    name: Deploy staging
    runs-on: ubuntu-latest # TEMPORARY: was [self-hosted, linux]
    timeout-minutes: 15
    permissions:
      contents: read
      packages: read
    concurrency:
      group: staging
      cancel-in-progress: false
    environment:
      name: staging
      url: https://api.nearbystaging.app/health
    steps:
      - name: Check out staging
        uses: actions/checkout@v7
        with:
          ref: staging
          fetch-depth: 0

      # Only a commit on staging may run here with the secrets of the staging environment, and everything below comes
      # from it: the .env template here, the compose file and scripts on the server.
      - name: Check out the commit to deploy
        env:
          VERSION: ${{ inputs.version }}
        run: |
          version=${VERSION:-$(git rev-parse HEAD)}
          if ! [[ $version =~ ^[0-9a-f]{40}$ ]] || ! git merge-base --is-ancestor "$version" HEAD; then
            echo "::error::The version must be the full SHA of a commit on staging"
            exit 1
          fi
          git checkout --quiet --detach "$version"
          if [ ! -f deploy/staging.env ]; then
            echo "::error::$version is older than the staging setup"
            exit 1
          fi
          echo "VERSION=$version" >>"$GITHUB_ENV"

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      # The rendered .env and the registry token go through stdin, so neither touches the runner's disk or
      # shows in a command line. deploy-staging.sh logs out of ghcr.io when it ends, and rolls back to the
      # previous version if the new one is not healthy.
      - name: Write the .env and deploy over SSH
        env:
          SSH_KEY: ${{ secrets.SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ vars.SSH_KNOWN_HOSTS }}
          SSH_TARGET: ${{ vars.SSH_USER }}@${{ vars.SSH_HOST }}
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GOOGLE_CLIENT_IDS: ${{ vars.GOOGLE_CLIENT_IDS }}
          TURBOSMS_SENDER: ${{ vars.TURBOSMS_SENDER }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          NEARBY_MAIN_PASSWORD: ${{ secrets.NEARBY_MAIN_PASSWORD }}
          NEARBY_IMPORT_PASSWORD: ${{ secrets.NEARBY_IMPORT_PASSWORD }}
          TELEGRAM_GATEWAY_TOKEN: ${{ secrets.TELEGRAM_GATEWAY_TOKEN }}
          TURBOSMS_TOKEN: ${{ secrets.TURBOSMS_TOKEN }}
        run: |
          set -o pipefail
          ssh_dir=$(mktemp -d)
          trap 'rm -rf "$ssh_dir"' EXIT
          printf '%s\n' "$SSH_KEY" >"$ssh_dir/key"
          chmod 600 "$ssh_dir/key"
          printf '%s\n' "$SSH_KNOWN_HOSTS" >"$ssh_dir/known_hosts"
          ssh=(ssh -i "$ssh_dir/key" -o UserKnownHostsFile="$ssh_dir/known_hosts" -o StrictHostKeyChecking=yes
            -o BatchMode=yes -o ConnectTimeout=20 "$SSH_TARGET")
          node deploy/render-env.mjs deploy/staging.env >/dev/null # fails before connecting if a value is missing
          node deploy/render-env.mjs deploy/staging.env |
            "${ssh[@]}" 'umask 077 && cat >/opt/nearby/.env.new && mv /opt/nearby/.env.new /opt/nearby/.env'
          printf '%s\n' "$GHCR_TOKEN" |
            "${ssh[@]}" "$(printf 'GHCR_USER=%q /opt/nearby/deploy/deploy-staging.sh %q' "$GHCR_USER" "$VERSION")"
