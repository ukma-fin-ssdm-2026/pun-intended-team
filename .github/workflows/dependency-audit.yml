name: Dependency audit

on:
  workflow_call:
  workflow_dispatch:

permissions: {}

jobs:
  audit:
    name: npm audit
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      # SEC-006: zero High and Critical advisories. --package-lock-only reads the lock files without installing.
      - name: Audit all three packages
        run: |
          status=0
          for dir in . src/mcp tools/mcp-generator; do
            echo "::group::npm audit in $dir"
            (cd "$dir" && npm audit --package-lock-only --audit-level=high) || status=1
            echo "::endgroup::"
          done
          exit $status