# AI Usage Note
# Generated by Claude (Claude Code): this workflow and the test:e2e script it runs.
# How it was verified: npm run test:e2e run locally with Node 26 (32 of 32 tests pass).
# The workflow itself runs only on GitHub.
# Reviewed by: Vlad-Re
# Changed by Claude (Claude Code): added the PostgreSQL service and the migration step.
# Changed by Claude (claude.ai): triggers only. Push and pull request runs now come from ci.yml,
# which calls this file; workflow_dispatch keeps a manual run from the Actions tab.
name: API tests

on:
  workflow_call:
  workflow_dispatch:

permissions: {}

jobs:
  e2e:
    name: E2E tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      DATABASE_URL: postgresql://nearby:nearby_dev_password@localhost:5432/nearby
    # Same image and credentials as docker-compose.yml. Throwaway database, so the password is not a secret.
    services:
      postgres:
        image: postgis/postgis:18-3.6
        env:
          POSTGRES_USER: nearby
          POSTGRES_PASSWORD: nearby_dev_password
          POSTGRES_DB: nearby
        ports:
          - 5432:5432
        volumes:
          # The image's init script would create PostGIS here; the migrations do it, as in docker-compose.yml.
          - /dev/null:/docker-entrypoint-initdb.d/10_postgis.sh:ro
        options: >-
          --health-cmd "pg_isready -U nearby -d nearby"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Apply database migrations
        run: npx prisma migrate deploy

      - name: Run e2e tests
        run: npm run test:e2e
