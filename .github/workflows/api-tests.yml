# which calls this file; workflow_dispatch keeps a manual run from the Actions tab.
name: API tests

on:
  workflow_call:
  workflow_dispatch:

permissions: {}

jobs:
  e2e:
    name: E2E tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Run e2e tests
        run: npm run test:e2e
