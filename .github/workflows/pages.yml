# Generated by Claude (Claude Code): this workflow.
# How it was verified (issue #90): actionlint 1.7.12 + shellcheck 0.11.0; the run: steps were run
# locally with Node 26 for each event with a fresh, a stale and a deleted spec, and with changed,
# extra and deleted vendored files. Triggers, the deploy condition and the deploy itself run only on GitHub.
# Reviewed by: Daryna Halytska
# Changed by Claude (claude.ai): deploy only. The docs check moved to api-docs.yml, which ci.yml runs on
# every pull request; this file reuses it to build the Pages artifact and then deploys it from main.
name: API docs (GitHub Pages)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

jobs:
  build:
    uses: ./.github/workflows/api-docs.yml
    with:
      upload-pages-artifact: ${{ github.ref == 'refs/heads/main' }}
    permissions:
      contents: read

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
