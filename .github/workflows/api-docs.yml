# AI Usage Note
# Generated by Claude (Claude Code): the steps of this workflow, originally the build job of pages.yml.
# How it was verified (issue #90): actionlint 1.7.12 + shellcheck 0.11.0; the run: steps were run
# locally with Node 26 for each event with a fresh, a stale and a deleted spec, and with changed,
# extra and deleted vendored files. Triggers, the deploy condition and the deploy itself run only on GitHub.
# Reviewed by: Daryna Halytska
# Changed by Claude (claude.ai): moved out of pages.yml into a reusable workflow so that ci.yml can run
# the docs check without the deploy. The steps are unchanged; the Pages artifact is uploaded only when
# the caller asks for it (pages.yml does, ci.yml does not).
name: API docs check

on:
  workflow_call:
    inputs:
      upload-pages-artifact:
        description: Upload docs/api as the GitHub Pages artifact for a following deploy job.
        type: boolean
        default: false
  workflow_dispatch:

permissions: {}

jobs:
  build:
    name: Generate and check API docs
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Check vendored Swagger UI matches swagger-ui-dist
        run: |
          version=$(node -p "require('./node_modules/swagger-ui-dist/package.json').version")
          status=0
          for file in docs/api/vendor/swagger-ui/*; do
            name=$(basename "$file")
            [ "$name" = README.md ] && continue
            if ! cmp -s "$file" "node_modules/swagger-ui-dist/$name"; then
              echo "::error file=$file::$name differs from swagger-ui-dist $version in node_modules. Update docs/api/vendor/swagger-ui/ as described in docs/api/vendor/swagger-ui/README.md."
              status=1
            fi
          done
          for name in swagger-ui-bundle.js swagger-ui.css; do
            [ -f "docs/api/vendor/swagger-ui/$name" ] || { echo "::error::docs/api/vendor/swagger-ui/$name is missing; docs/api/index.html loads it."; status=1; }
          done
          exit $status

      - name: Generate OpenAPI spec
        run: npm run docs:generate

      # Fails a pull request; other events only warn, so main still deploys the freshly generated spec.
      - name: Check committed spec is up to date
        run: |
          if [ -n "$(git status --porcelain -- docs/api/openapi-generated.yaml)" ]; then
            git diff -- docs/api/openapi-generated.yaml
            message="The committed OpenAPI spec is missing or out of date. Run 'npm run docs:generate' and commit docs/api/openapi-generated.yaml."
            if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
              echo "::error file=docs/api/openapi-generated.yaml::$message"
              exit 1
            fi
            if [ "$GITHUB_REF" = refs/heads/main ]; then
              message="$message Publishing the freshly generated spec."
            fi
            echo "::warning file=docs/api/openapi-generated.yaml::$message"
          fi

      - if: inputs.upload-pages-artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs/api
