# AI Usage Note
# Generated by Claude (Claude Code)
# How it was verified: ran the whole stack locally with API_DOMAIN=localhost: migrations, /health through
# Caddy over HTTPS, an import run and a backup.
# Reviewed by: Viktoriia Baran
name: nearby-staging

x-image: &image ghcr.io/ukma-fin-ssdm-2026/nearby-api:${API_VERSION:-staging}

x-logging: &logging
  driver: json-file
  options:
    max-size: 10m
    max-file: '3'

services:
  db:
    logging: *logging
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env}
    # Only on the server itself, for psql or an SSH tunnel.
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - db-data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 5s
      timeout: 3s
      retries: 10

  # Before every API start: migrations as the owner, then the passwords of the roles.
  migrate:
    logging: *logging
    image: *image
    command: ['sh', '-c', 'node_modules/.bin/prisma migrate deploy && node dist/scripts/set-role-passwords.js']
    environment:
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in .env}
      MAIN_DATABASE_URL: ${MAIN_DATABASE_URL:?Set MAIN_DATABASE_URL in .env}
      IMPORT_DATABASE_URL: ${IMPORT_DATABASE_URL:?Set IMPORT_DATABASE_URL in .env}
      BACKUP_DATABASE_URL: ${BACKUP_DATABASE_URL:?Set BACKUP_DATABASE_URL in .env}
    depends_on:
      db:
        condition: service_healthy

  api:
    logging: *logging
    image: *image
    restart: unless-stopped
    environment:
      NODE_ENV: production
      TRUST_PROXY: uniquelocal
      CORS_ORIGINS: ${CORS_ORIGINS:-}
      SWAGGER_UI: ${SWAGGER_UI:-false}
      AUTH_RATE_LIMIT_PER_MINUTE: ${AUTH_RATE_LIMIT_PER_MINUTE:-20}
      MAIN_DATABASE_URL: ${MAIN_DATABASE_URL}
      CODE_HMAC_KEY_FILE: ${CODE_HMAC_KEY_FILE:?Set CODE_HMAC_KEY_FILE in .env}
      JWT_KEYS_FILE: ${JWT_KEYS_FILE:?Set JWT_KEYS_FILE in .env}
      CONTACT_HMAC_KEY_FILE: ${CONTACT_HMAC_KEY_FILE:?Set CONTACT_HMAC_KEY_FILE in .env}
      DATA_ENCRYPTION_KEY_FILE: ${DATA_ENCRYPTION_KEY_FILE:?Set DATA_ENCRYPTION_KEY_FILE in .env}
      GOOGLE_CLIENT_IDS: ${GOOGLE_CLIENT_IDS:?Set GOOGLE_CLIENT_IDS in .env}
      MESSAGING_PROVIDER: ${MESSAGING_PROVIDER:-disabled}
      TELEGRAM_GATEWAY_TOKEN: ${TELEGRAM_GATEWAY_TOKEN:-}
      TURBOSMS_TOKEN: ${TURBOSMS_TOKEN:-}
      TURBOSMS_SENDER: ${TURBOSMS_SENDER:-}
    volumes:
      - ./keys:/app/keys:ro
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  # The event import, as nearby_import: runs every provider daily at 02:00 UTC through the import.run jobs
  # (docs/operations/staging.md#event-import). It needs no key file and no MAIN_DATABASE_URL.
  import:
    logging: *logging
    image: *image
    restart: unless-stopped
    command: ['node', 'dist/import/main.js']
    environment:
      NODE_ENV: production
      IMPORT_DATABASE_URL: ${IMPORT_DATABASE_URL}
      ARTWIZARD_API_KEY: ${ARTWIZARD_API_KEY:-}
    # The job queue lets a running import finish for up to 30 s after SIGTERM.
    stop_grace_period: 40s
    # Its grants on the job queue come from the migrations.
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  # The web app: the static export of app/, served by its own Caddy.
  web:
    logging: *logging
    image: ghcr.io/ukma-fin-ssdm-2026/nearby-web:${API_VERSION:-staging}
    restart: unless-stopped

  caddy:
    logging: *logging
    image: caddy:2
    restart: unless-stopped
    environment:
      API_DOMAIN: ${API_DOMAIN:?Set API_DOMAIN in .env}
      WEB_DOMAIN: ${WEB_DOMAIN:?Set WEB_DOMAIN in .env}
    ports:
      - '80:80'
      - '443:443'
      - '443:443/udp'
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      # Certificates: kept across restarts, or Let's Encrypt rate-limits new ones.
      - caddy-data:/data
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_healthy

  backup:
    logging: *logging
    image: postgres:18
    restart: unless-stopped
    entrypoint: ['sh', '/backup-db.sh']
    healthcheck:
      test: ['CMD', 'sh', '/backup-db.sh', 'check']
      interval: 10m
      timeout: 10s
      start_period: 26h
    environment:
      PGHOST: db
      PGUSER: nearby_backup
      PGPASSWORD: ${NEARBY_BACKUP_PASSWORD:?Set NEARBY_BACKUP_PASSWORD in .env}
      PGDATABASE: ${POSTGRES_DB}
    volumes:
      - ./deploy/backup-db.sh:/backup-db.sh:ro
      - ${BACKUP_DIR:-./backups}:/backups
    # The role and its password come from migrate.
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

volumes:
  db-data:
    name: nearby-staging-db
    external: true
  caddy-data:
    name: nearby-staging-caddy
    external: true
